NBpgc4tZAnPrK5wKdY/7bFSOCI7Bhfn8jP8A1WIKn5cDXxg3wYJ1nG8Pi+kv7Y1ppCF+GEKN/wCTAOP4wAw1CcW5FOQspWFgxsyE6mnF6NY7DBEJoW4Qpi1rtp16wCBsStzkN+POXMDa9PHeMXUJsmzGCcHZnEwb5MEFwHdhiMRy3x48ZSgXVwQGwi+2DKgVL1/xm6aFlo5+2Wp5g25vL3h04O5kTXGE218DhysiiAvLlX2Bq2d5CyZWf//Z) center center/cover no-repeat;
  border-bottom:1px solid var(--line)}
/* The darkening under the title is a FIXED footer, not a percentage. As a
   percentage it grew with the hero, so making the band taller to show more of
   the photograph just added more veil over the part worth showing. 150px is
   what the two lines of text need and the rest of the frame stays clear. */
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(14,16,20,.12) 0,
    rgba(14,16,20,0) 90px,
    rgba(14,16,20,0) calc(100% - 150px),
    rgba(14,16,20,.60) calc(100% - 52px),
    #0e1014 100%)}
.hero-in{position:relative;z-index:1;width:100%;
  max-width:1080px;margin:0 auto;padding:30px 20px 16px}
.hero h1{margin:0;font-size:27px;letter-spacing:-.4px;line-height:1.1;
  text-shadow:0 2px 18px rgba(0,0,0,.85)}
.hero .hero-sub{margin:5px 0 0;font-size:13px;color:#c8cfd8;
  text-shadow:0 1px 10px rgba(0,0,0,.9)}
.hero .hero-credit{position:absolute;right:9px;bottom:5px;z-index:2;
  font-size:9px;color:rgba(255,255,255,.34);letter-spacing:.03em}
@media (max-width:620px){
  .hero{height:clamp(160px,42vw,230px)}
  .hero-in{padding:22px 14px 12px}
  .hero h1{font-size:21px}
  .hero .hero-sub{font-size:12px}
}


/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  background:rgba(6,8,12,.72);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;
  align-items:center;gap:18px}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.06em;white-space:nowrap;
  background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--dim);
  font:600 13px Inter,sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer;
  white-space:nowrap;transition:all .2s ease}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.tab-btn.active{color:#0b0d12;background:var(--hot);box-shadow:0 6px 20px -6px rgba(255,90,40,.7)}

/* ---------- hero ---------- */
.hero{height:clamp(300px,38vw,460px)!important;margin:0!important}
.hero-in{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  flex-wrap:wrap;padding-bottom:30px!important;max-width:1180px!important}
.eyebrow{font:700 12px Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.9)}
.hero h1{font-family:var(--display)!important;font-weight:400;font-size:clamp(64px,11vw,132px)!important;
  line-height:.88!important;letter-spacing:.01em!important;margin:6px 0 0!important;
  color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.85),0 0 60px rgba(0,0,0,.6)!important}
.hero h1 span{background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px rgba(255,60,60,.35))}
.hero .sub{color:#d6dce5;font-size:14px;margin-top:8px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hstat{background:rgba(10,12,18,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line-2);border-radius:14px;padding:12px 16px;min-width:120px}
.hstat .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.hstat .v{font-family:var(--display);font-size:34px;line-height:1;margin-top:4px}
.hstat .s{font-size:12px;color:var(--dim)}

/* ---------- sections ---------- */
main{padding:28px 0 60px}
.tab{display:none}
.tab.active{display:block;animation:fade .45s ease both}
.sec{margin:40px 0 16px}
.sec:first-child{margin-top:4px}
.sec h2{font-family:var(--display);font-weight:400;font-size:36px;line-height:1;letter-spacing:.02em;margin:0}
.sec .aside{display:block;margin-top:6px;color:var(--faint);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* ---------- team badge ---------- */
.tb{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;
  font:800 13px Inter,sans-serif;letter-spacing:.02em;color:#fff;flex:none;
  background:linear-gradient(135deg,var(--c1) 0%,var(--c1) 55%,var(--c2) 140%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 6px 16px -6px var(--c2)}
.tb.sm{width:30px;height:30px;border-radius:9px;font-size:10.5px}
.tb.lg{width:64px;height:64px;border-radius:18px;font-size:19px}

/* ---------- spotlight ---------- */
.spot{position:relative;overflow:hidden;border-radius:24px;padding:28px;
  background:radial-gradient(900px 300px at 0% 0%,color-mix(in srgb,var(--c1) 70%,transparent),transparent 70%),
             radial-gradient(700px 300px at 100% 100%,color-mix(in srgb,var(--c2) 40%,transparent),transparent 70%),
             #0d1016;
  border:1px solid var(--line-2);box-shadow:var(--shadow);
  display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.spot::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);
  transform:translateX(-100%);animation:sheen 3.8s ease-in-out 1s infinite}
.spot .lbl{display:inline-flex;align-items:center;gap:8px;font:800 11px Inter,sans-serif;
  letter-spacing:.2em;text-transform:uppercase;color:#0b0d12;background:var(--hot);
  padding:6px 12px;border-radius:99px}
.spot .who{display:flex;align-items:center;gap:16px;margin-top:16px}
.spot .team{font-family:var(--display);font-size:clamp(40px,6vw,64px);line-height:.9}
.spot .vs{color:var(--dim);font-size:14px;margin-top:6px}
.spot .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}
.fact .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.fact .v{font-size:17px;font-weight:700;margin-top:2px}

/* ---------- ring ---------- */
.ring{position:relative;width:64px;height:64px;flex:none}
.ring.lg{width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:7}
.ring .bar{fill:none;stroke-width:7;stroke-linecap:round;stroke:var(--rc);
  filter:drop-shadow(0 0 6px var(--rc));animation:draw 1.2s cubic-bezier(.2,.7,.2,1) both}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .lab b{font-family:var(--display);font-weight:400;font-size:24px}
.ring.lg .lab b{font-size:52px}
.ring .lab i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:2px}
.ring.lg .lab i{font-size:13px}

/* ---------- pick cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{position:relative;overflow:hidden;border-radius:var(--radius);padding:16px 16px 14px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--c1),var(--c2))}
.card:hover{transform:translateY(-4px);border-color:var(--line-2);
  box-shadow:0 26px 60px -24px color-mix(in srgb,var(--c2) 55%,transparent),var(--shadow)}
.card .top{display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.card .rank{font-family:var(--display);font-size:20px;color:var(--dim);letter-spacing:.04em}
.card .body{display:flex;align-items:center;gap:14px;margin-top:10px}
.teams{flex:1;display:grid;gap:8px;min-width:0}
.trow{display:flex;align-items:center;gap:10px;min-width:0;opacity:.5;transition:opacity .2s}
.trow.pk{opacity:1}
.trow .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .at{font-size:11px;color:var(--faint);font-weight:600;margin-left:-4px}
.pickpill{margin-left:auto;font:800 10px Inter,sans-serif;letter-spacing:.14em;color:#0b0d12;
  background:var(--gold);padding:3px 8px;border-radius:99px;flex:none}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.lines.one{grid-template-columns:1fr}
.lines div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.lines span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.lines b{display:block;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{font-size:11.5px;font-weight:600;color:var(--dim);background:rgba(255,255,255,.05);
  border:1px solid var(--line);padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip b{color:var(--text)}
.chip.differ{color:#0b0d12;background:var(--hot);border-color:transparent}
.chip.tag{color:#cfd6e2;background:rgba(77,163,255,.1);border-color:rgba(77,163,255,.25)}
.card .top{display:grid!important;grid-template-columns:1fr auto 1fr}
.card .top .mid{justify-self:center}
.card .top .tr{justify-self:end}
.res{font:800 10.5px Inter,sans-serif;letter-spacing:.12em;
  padding:4px 9px;border-radius:99px}
.res.won{background:rgba(47,214,123,.16);color:var(--green);border:1px solid rgba(47,214,123,.4)}
.res.lost{background:rgba(255,59,74,.14);color:var(--red);border:1px solid rgba(255,59,74,.4)}

/* ---------- bets ---------- */
.best{position:relative;border-radius:24px;padding:2px;background:var(--hot);
  background-size:200% 200%;animation:flow 6s ease infinite,rise .6s ease both;box-shadow:0 30px 80px -30px rgba(255,90,40,.6)}
.best-in{border-radius:22px;background:radial-gradient(800px 260px at 0% 0%,rgba(255,80,40,.22),transparent 70%),#0d1016;
  padding:26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.best .lbl{font:800 11px Inter,sans-serif;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.best .play{font-family:var(--display);font-size:clamp(40px,6vw,64px);line-height:.95;margin-top:8px}
.best .cond{font-size:18px;font-weight:700;margin-top:4px}
.best .game{color:var(--dim);font-size:14px;margin-top:6px}
.best .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.best .warn{margin-top:14px;font-size:12.5px;color:#ffd9a0}
.caution{display:flex;gap:10px;align-items:center;margin:16px 0 0;padding:12px 16px;border-radius:14px;
  background:rgba(255,197,61,.07);border:1px solid rgba(255,197,61,.25);color:#f3dfb0;font-size:13px}
.cols.leans .panel{opacity:.82}
.cols.leans .count{background:rgba(255,255,255,.12);color:var(--text)}
.caution .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);flex:none;
  animation:pulse 2s ease-in-out infinite}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.list .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.list .hd h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.02em}
.count{font:800 12px Inter,sans-serif;color:#0b0d12;background:var(--gold);border-radius:99px;padding:3px 9px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 18px;
  border-top:1px solid var(--line);transition:background .2s}
.row:hover{background:rgba(255,255,255,.03)}
.row .t{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c{font-size:13px;color:var(--text);opacity:.85;margin-top:1px}
.row .g{font-size:11.5px;color:var(--faint);margin-top:2px}
.nums{display:grid;grid-template-columns:auto auto;gap:2px 8px;font-size:12px;color:var(--faint);
  white-space:nowrap;text-align:right;align-items:baseline}
.nums b{color:var(--text);font-size:13px}
.dog{font:800 9.5px Inter,sans-serif;letter-spacing:.12em;color:var(--gold);border:1px solid rgba(255,197,61,.4);
  border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.empty{padding:40px 24px;text-align:center}
.empty .big{font-family:var(--display);font-size:40px;letter-spacing:.02em}
.empty p{color:var(--dim);margin:6px 0 0}

/* ---------- power ---------- */
.pwbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.segs{display:inline-flex;padding:4px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg{appearance:none;border:0;background:transparent;color:var(--dim);font:700 12.5px Inter,sans-serif;
  padding:7px 14px;border-radius:99px;cursor:pointer;transition:all .2s}
.seg:hover{color:var(--text)}
.seg.on{background:var(--hot);color:#0b0d12}
.confh{font-family:var(--display);font-size:26px;letter-spacing:.06em;color:var(--dim);margin:6px 0 10px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}
.dcard{padding:6px 0 8px;animation:rise .5s ease both;animation-delay:calc(var(--i) * 50ms);overflow:hidden}
.dh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.dh h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em}
.dh .dcols span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:700;text-align:right}
.dcols{display:grid;grid-template-columns:repeat(3,62px);gap:8px;flex:none}
.drow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);position:relative}
.drow.lead{background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 22%,transparent),transparent 70%)}
.drow.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.dn{flex:1;min-width:0}
.dn b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn small{display:block;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od{text-align:right}
.od b{font-size:14px;font-variant-numeric:tabular-nums}
.od i{display:block;height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
.od s{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .9s ease both}
.od.g s{background:linear-gradient(90deg,#1f9d5c,#2fd67b)}
.od.b s{background:linear-gradient(90deg,#2d6fd6,#4da3ff)}
.od.o s{background:linear-gradient(90deg,#ff3b4a,#ffc53d)}
.lt{overflow:hidden}
.lrowh,.lr{display:grid;grid-template-columns:44px minmax(0,1.8fr) 80px repeat(3,minmax(70px,1fr));gap:12px;
  align-items:center;padding:10px 18px}
.lrowh{padding-top:14px;padding-bottom:8px}
.th{appearance:none;border:0;background:transparent;color:var(--faint);font:700 10.5px Inter,sans-serif;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-align:right;padding:4px 0;
  display:flex;align-items:center;justify-content:flex-end;gap:5px}
.th.c-rank,.th.c-team{justify-content:flex-start}
.th:hover{color:var(--text)}
.th.on{color:var(--gold)}
.car{font-size:8px}
.lr{border-top:1px solid var(--line);animation:rise .45s ease both;animation-delay:calc(var(--i) * 15ms)}
.lr .rk{font-family:var(--display);font-size:24px;color:var(--dim)}
.lr.top3 .rk{background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent}
.lr .tm{display:flex;align-items:center;gap:10px;min-width:0}
.lr .tm b{display:block;font-size:15px}
.lr .tm small{display:block;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .c-wins{text-align:right;font-weight:700}

/* ---------- advanced ---------- */
.avbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.advt{min-width:640px}
.atrow{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(var(--cols),minmax(92px,1fr));gap:10px;
  align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.atrow.hd{border-top:0;padding-top:14px}
.atrow .tm{display:flex;align-items:center;gap:10px;min-width:0;position:sticky;left:0;background:inherit}
.atrow .tm b{font-size:15px;white-space:nowrap}
.mv{text-align:right}
.mv b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums}
.mv small{display:block;font-size:11px;color:var(--faint)}
.mv.top b{color:var(--green)} .mv.bot b{color:#ff7b86}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mcard{padding:16px 18px;animation:rise .5s ease both;animation-delay:calc(var(--i) * 40ms)}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:10px}
.mhead .side{display:flex;align-items:center;gap:10px;min-width:0}
.mhead .side.r{justify-content:flex-end;text-align:right}
.mhead b{font-size:16px}
.mhead .when{font-size:11.5px;color:var(--faint);text-align:center;white-space:nowrap}
.mrow{display:grid;grid-template-columns:1fr minmax(120px,1.3fr) 1fr;gap:8px;align-items:center;
  padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.mrow .l{text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.mrow .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mrow .m{text-align:center;color:var(--faint);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mrow .edge{color:var(--green)}
.mrow.qb .l,.mrow.qb .r{font-weight:800;color:var(--text)}
.qbn{display:block;font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.inj{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.inj2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.injs{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.injs.r{align-items:flex-end}
.injh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.injs.r .injh{flex-direction:row-reverse}
.injh .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.injs .none{font-size:12px;color:var(--faint)}
.st{font:800 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.st.Out,.st.IR,.st.PUP,.st.Sus,.st.NA{background:rgba(255,59,74,.16);color:#ff7b86;border:1px solid rgba(255,59,74,.4)}
.st.Doubtful{background:rgba(255,138,0,.15);color:#ffb35c;border:1px solid rgba(255,138,0,.4)}
.st.Questionable{background:rgba(255,197,61,.12);color:var(--gold);border:1px solid rgba(255,197,61,.35)}
.st.Cleared{background:rgba(47,214,123,.14);color:var(--green);border:1px solid rgba(47,214,123,.4)}
.ichip{font-size:12px;color:var(--dim);display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:3px 8px 3px 4px}
.trn{padding:6px 18px;margin-bottom:6px}
.trrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px 130px;gap:12px;align-items:center;
  padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.trrow:first-child{border-top:0}
.trrow.hd{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.trrow .rt{text-align:right}
.trrow b{font-size:15px}
.trrow small{color:var(--faint);font-size:11.5px;margin-left:4px}
.trrow .dim{color:var(--dim)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.icard{padding:18px;animation:rise .5s ease both;animation-delay:calc(var(--i) * 40ms)}
.icard h3{margin:10px 0 4px;font-size:17px;line-height:1.25}
.icard p{margin:0;color:var(--dim);font-size:13px}
.vd{display:inline-block;font:800 10.5px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px}
.vd.hold{background:rgba(47,214,123,.16);color:var(--green);border:1px solid rgba(47,214,123,.45)}
.vd.priced{background:rgba(77,163,255,.14);color:#8cc4ff;border:1px solid rgba(77,163,255,.4)}
.vd.noise{background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--line-2)}
.iweek{display:flex;align-items:center;gap:6px;margin-top:10px}
.iweek .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-right:4px}
.istats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.istats div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.istats span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.istats b{display:block;font-size:18px;margin-top:2px;font-variant-numeric:tabular-nums}
.ilast{margin-top:10px;font-size:12px;color:var(--faint)}
.frow{display:grid;grid-template-columns:30px minmax(0,1fr) 70px 80px 70px;gap:10px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.frow .num{text-align:right}
.nrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:11px 18px;border-top:1px solid var(--line)}
.nrow b{font-size:15px}
.nrow small{display:block;color:var(--faint);font-size:12px}
.nrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chg{font:800 9.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#0b0d12;
  background:var(--hot);padding:2px 7px;border-radius:99px}
.note2{color:var(--faint);font-size:12.5px;margin:-6px 0 16px}

/* ---------- leaders ---------- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.lcard{padding:18px;animation:rise .55s ease both;animation-delay:calc(var(--i) * 40ms)}
.lcard h3{margin:0 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.lead1{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.lead1 .v{margin-left:auto;font-family:var(--display);font-size:40px;line-height:1;
  background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead1 .n{font-weight:800;font-size:16px;line-height:1.2}
.lead1 .n small{display:block;color:var(--faint);font-weight:500;font-size:12px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
.lrow .p{color:var(--faint);width:20px;text-align:right;flex:none}
.lrow .ln{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .more{display:none}
.lcard.open .more{display:block;animation:fade .35s ease both}
.expand{display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px;
  padding:9px;border-radius:12px;border:1px dashed var(--line-2);background:rgba(255,255,255,.03);
  color:var(--dim);font:700 12.5px Inter,sans-serif;letter-spacing:.06em;cursor:pointer;
  transition:all .2s ease}
.expand:hover{color:var(--text);border-color:var(--gold);background:rgba(255,197,61,.07)}
.expand .minus{display:none}
.lcard.open .expand .plus{display:none}
.lcard.open .expand .minus{display:inline}
.lrow .v{margin-left:auto;font-weight:700}

/* ---------- record ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{padding:20px;animation:rise .55s ease both;animation-delay:calc(var(--i) * 60ms);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,120,40,.18),transparent 70%)}
.tile .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.tile .v{font-family:var(--display);font-size:56px;line-height:1;margin-top:8px}
.tile .s{font-size:13px;color:var(--dim)}
.tile.idle .v{color:var(--faint)}
.bar2{height:6px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--hot);transform-origin:left;animation:grow 1.1s ease both}
.weeks{display:flex;gap:10px;flex-wrap:wrap}
.vsgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.vsside,.vsgap{padding:20px}
.vsside .k,.vsgap .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.vsside .v,.vsgap .v{font-family:var(--display);font-size:56px;line-height:1;margin-top:8px}
.vsside .s,.vsgap .s{font-size:13px;color:var(--dim)}
.vsside.them .bar2 i{background:linear-gradient(90deg,#2d6fd6,#4da3ff)}
.vsgap{text-align:center;min-width:150px;display:flex;flex-direction:column;justify-content:center}
.vsgap .v .u{font-family:Inter,sans-serif;font-size:14px;font-weight:700;margin-left:4px;color:var(--dim)}
.vsgap .v.pos{color:var(--green)} .vsgap .v.neg{color:#ff7b86}
.vsweeks{margin-top:14px;padding:6px 18px}
.vsrow{display:grid;grid-template-columns:80px 1fr 90px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vsrow:first-child{border-top:0}
.wkl{font-family:var(--display);font-size:22px;letter-spacing:.03em}
.vsbars{display:grid;gap:6px}
.vb{display:grid;grid-template-columns:44px 1fr 52px;gap:10px;align-items:center;font-size:12px;color:var(--faint)}
.vb i{display:block;height:8px;border-radius:99px;transform-origin:left;animation:grow 1s ease both}
.vb.us i{background:var(--hot)} .vb.them i{background:linear-gradient(90deg,#2d6fd6,#4da3ff)}
.vb b{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.vstag{font:800 10.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;
  padding:4px 8px;border-radius:99px}
.vstag.us{background:rgba(47,214,123,.16);color:var(--green)}
.vstag.them{background:rgba(77,163,255,.14);color:#8cc4ff}
.vstag.even{background:rgba(255,255,255,.06);color:var(--dim)}
.vsnote{margin-top:12px;color:var(--dim);font-size:13px}
.lngrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lnside{padding:20px}
.lnside .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.lnside .v{font-family:var(--display);font-size:48px;line-height:1;margin-top:8px}
.lnside .s{font-size:13px;color:var(--dim)}
.lntab{margin-top:14px;padding:6px 18px}
.lnrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px;gap:12px;padding:11px 0;
  border-top:1px solid var(--line);font-size:14px;align-items:center}
.lnrow:first-child{border-top:0}
.lnrow.hd{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.lnrow .rt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lnrow .rt.win{color:var(--green)}
.vsnote b{color:var(--text)}
.wk{padding:12px 16px;border-radius:14px;min-width:96px;text-align:center}
.wk .k{font-size:10.5px;letter-spacing:.16em;color:var(--faint);font-weight:700}
.wk .v{font-family:var(--display);font-size:30px;line-height:1.1}

footer{color:var(--faint);font-size:12px;text-align:center;padding:30px 0 40px}

/* ---------- motion ---------- */
/* ---------- charts ---------- */
.chgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.chart{padding:18px;margin-bottom:14px;min-width:0}
.chgrid .chart{margin-bottom:0}
.chgrid + .chart,.chart + .chgrid{margin-top:14px}
.chd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.chd h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.03em;line-height:1}
.csub{font-size:12px;color:var(--faint);margin-top:5px;max-width:560px}
.segs.sm{padding:3px}
.segs.csegs{display:flex;flex-wrap:wrap;border-radius:18px;max-width:100%}

.rbr .pn{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtrack{position:relative;height:100%}
.rb{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--c1);

  animation-delay:calc(var(--i) * 18ms)}
.rb.pos{transform-origin:left;border-right:3px solid var(--c2)}
.rb.neg{transform-origin:right;border-left:3px solid var(--c2)}
.rlab{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:6px;
  font:700 12px Inter,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums;
  animation:fade .6s both;animation-delay:calc(var(--i) * 18ms + .35s)}
.rlab.neg{flex-direction:row-reverse}
.rlab small{font-weight:500;color:var(--faint);font-size:11px}

.rbars.dv .rtrack::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--line-2)}

/* scatter */
.sc{display:block;width:100%;height:auto;overflow:visible}
.sc .grid{stroke:rgba(255,255,255,.055)}
.sc .mean{stroke:rgba(255,197,61,.5);stroke-dasharray:4 5}
.sc .diag{stroke:rgba(255,255,255,.25);stroke-dasharray:3 4}
.sc text{fill:var(--faint);font:11px Inter,sans-serif}
.sc .axl{fill:var(--dim);font:700 10.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.sc .q{fill:rgba(255,255,255,.3);font:800 11px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.sc .pl{fill:#e6ebf2;font:600 10.5px Inter,sans-serif;paint-order:stroke;stroke:rgba(6,8,12,.85);stroke-width:3px}
.sc .sab{fill:#fff;font:800 9px Inter,sans-serif}

  animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;animation-delay:calc(var(--i) * 18ms)}
.debar span{height:100%}
.der .v{font:700 12px Inter,sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* heat map */
.heat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:14px;border-radius:14px;

.hcell{border-radius:10px;padding:16px 8px;text-align:center;min-height:92px;display:flex;flex-direction:column;

.hcell b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1}
.hcell small{display:block;font-size:11px;color:rgba(255,255,255,.75);margin-top:4px}
.hcell .z{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700;margin-bottom:6px}
.hlos{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);font-weight:800}
.hlos::before,.hlos::after{content:"";flex:1;border-top:2px dashed rgba(255,197,61,.45)}
.hcap{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:8px}

/* week by week */
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wcard{padding:12px 12px 10px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);

const T = DATA.teams || {};

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function team(a){ return T[a] || [a, "#333a47", "#8a93a3"]; }
function cvars(a){ const t = team(a); return `--c1:${t[1]};--c2:${t[2]}`; }
function badge(a, size){
  return `<span class="tb ${size || ""}" style="${cvars(a)}">${esc(a)}</span>`;
}
function nick(a){ return team(a)[0]; }
function when(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US", {weekday:"short"}) + " "
    + d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
}
function ring(conf, scale, big){
  const r = 42, c = 2 * Math.PI * r, share = scale ? conf / scale : 0;
  const col = share > 2/3 ? "#2fd67b" : (share > 1/3 ? "#4da3ff" : "#8a93a3");
  const off = c * (1 - share);
  return `<div class="ring ${big ? "lg" : ""}" style="--rc:${col};--circ:${c.toFixed(1)}">
    <svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="${r}"/>
    <circle class="bar" cx="50" cy="50" r="${r}" stroke-dasharray="${c.toFixed(1)}"
      stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="lab"><div><b>${conf}</b><i>of ${scale}</i></div></div></div>`;
}
function section(title, aside){
  return `<div class="sec"><h2>${esc(title)}</h2>${aside ? `<div class="aside">${aside}</div>` : ""}</div>`;
}

/* ---------- hero ---------- */
function renderHero(){
  const picks = DATA.picks || [];
  const ko = picks.map(p => p.kickoff).filter(Boolean).sort();
  const day = iso => new Date(iso).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
  let sub = `${DATA.n_games} games`;
  if (ko.length && !isNaN(new Date(ko[0]).getTime()))
    sub = `${day(ko[0])} to ${day(ko[ko.length-1])} &middot; ${DATA.n_games} games`;
  document.getElementById("hero-sub").innerHTML = sub;
  const tiles = (DATA.record || {}).tiles || [];
  const su = tiles.find(t => t.key === "su");
  const top = picks[0];
  let h = "";
  if (su && su.record) h += `<div class="hstat"><div class="k">Season</div>
      <div class="v num">${esc(su.record)}</div><div class="s">${su.pct}% of picks right</div></div>`;
  if (top) h += `<div class="hstat"><div class="k">Top pick</div>
      <div class="v">${esc(nick(top.pick))}</div><div class="s">${top.conf} of ${top.scale} confidence</div></div>`;
  document.getElementById("hero-stats").innerHTML = h;
}

/* ---------- picks ---------- */
/* Our own line appears only once the lines scorecard's gate is earned (more
   graded games than its minimum, with a smaller average miss than the
   oddsmakers'). Until then the card shows the oddsmakers' line alone. */
function ourLinesEarned(){ return !!(((DATA.lines || {}).gate || {}).our_lines_earned); }
function projLine(p){
  const a = p.by != null && p.model_side ? `${esc(p.model_side)} by ${p.by}` : "&ndash;";
  const b = p.their && p.their_by != null ? `${esc(p.their)} by ${p.their_by}` : "&ndash;";
  if (!ourLinesEarned())
    return `<div class="lines one"><div><span>Oddsmakers</span><b>${b}</b></div></div>`;
  return `<div class="lines"><div><span>Our model</span><b>${a}</b></div>
    <div><span>Oddsmakers</span><b>${b}</b></div></div>`;
}
function card(p, i){
  const other = p.pick === p.home ? p.away : p.home;
  const row = (a, isHome) => `<div class="trow ${a === p.pick ? "pk" : ""}">
      ${badge(a)}<span class="nm">${esc(nick(a))}</span>
      ${isHome ? '<span class="at">HOME</span>' : ""}
      ${a === p.pick ? '<span class="pickpill">PICK</span>' : ""}</div>`;
  const differ = p.their && p.their !== p.pick;
  const tip = "";
  return `<div class="card"${tip} style="${cvars(p.pick)};--i:${i}">
    <div class="top"><span class="rank">#${i + 1}</span><span class="mid">${p.result
      ? `<span class="res ${p.result}">${p.result === "won" ? "WON" : "LOST"}</span>` : ""}</span>
      <span class="tr">${esc(when(p.kickoff))}</span></div>
    <div class="body"><div class="teams">${row(p.away, false)}${row(p.home, true)}</div>
      ${ring(p.conf, p.scale)}</div>
    ${projLine(p)}
    <div class="foot">${differ ? '<span class="chip differ">Against the oddsmakers</span>' : ""}
      ${p.final ? `<span class="chip">Final <b>${esc(p.final)}</b></span>` : ""}</div>
  </div>`;
}
function renderPicks(){

  if (!picks.length){ el.innerHTML = `<div class="panel empty"><div class="big">Picks coming soon</div></div>`; return; }

  const spot = `<div class="spot" style="${cvars(top.pick)}">
    <div>

/* ---------- power ---------- */
/* Power rankings: by division by default, or the whole league as one table
   that sorts on any column. Both filter by conference. Only the numbers fans
   ask about: record, projected wins, and the chance to win the division,
   make the playoffs and win the Super Bowl. */
const PW = {view: "div", conf: "All", sort: "rank", dir: 1};
const DIVS = ["East", "North", "South", "West"];
function pct(p){
  if (p == null) return "&ndash;";
  if (p > 0 && p < 0.005) return "<1%";
  if (p > 0.995 && p < 1) return ">99%";
  return Math.round(100 * p) + "%";
}
/* A probability as a number with a thin bar under it, so a column reads at a
   glance without becoming a heat map. */
function odds(p, cls, scale){
  const w = p == null ? 0 : Math.max(2, Math.min(100, Math.round(100 * p / (scale || 1))));
  return `<div class="od ${cls || ""}"><b>${pct(p)}</b><i><s style="width:${w}%"></s></i></div>`;
}
/* Title odds top out near 12 percent, so their bars are scaled to the league
   leader; the printed number is always the real one. */
function titleMax(){
  return Math.max(0.01, ...(DATA.power || []).map(t => t.title || 0));
}
function pwControls(){
  const b = (group, val, label) => `<button class="seg ${PW[group] === val ? "on" : ""}"
      onclick="PW.${group}='${val}';renderPower()">${label}</button>`;
  return `<div class="pwbar">
    <div class="segs">${b("view", "div", "By division")}${b("view", "league", "League")}</div>
    <div class="segs">${b("conf", "All", "All")}${b("conf", "AFC", "AFC")}${b("conf", "NFC", "NFC")}</div>
  </div>`;
}
function divCard(name, teams, i){
  teams = teams.slice().sort((a, b) => (b.divodds || 0) - (a.divodds || 0));
  return `<div class="panel dcard" style="--i:${i}">
    <div class="dh"><h3>${esc(name)}</h3>
      <div class="dcols"><span>Division</span><span>Playoffs</span><span>Title</span></div></div>
    ${teams.map((t, k) => `<div class="drow ${k === 0 ? "lead" : ""}" style="${cvars(t.team)}">
      ${badge(t.team, "sm")}
      <div class="dn"><b>${esc(nick(t.team))}</b><small>${esc(t.record || "")}${t.wins != null
        ? ` &middot; ${t.wins.toFixed(1)} proj wins` : ""}</small></div>
      <div class="dcols">${odds(t.divodds, "g")}${odds(t.playoff, "b")}${odds(t.title, "o", titleMax())}</div>
    </div>`).join("")}
  </div>`;
}
function leagueTable(teams){
  const cols = [["rank", "#", 1], ["team", "Team", 1], ["wins", "Proj wins", -1],
                ["divodds", "Division", -1], ["playoff", "Playoffs", -1], ["title", "Title", -1]];
  const key = PW.sort;
  const val = t => key === "team" ? nick(t.team) : (t[key] == null ? -1 : t[key]);
  teams = teams.slice().sort((a, b) => {
    const x = val(a), y = val(b);
    return (x < y ? -1 : x > y ? 1 : 0) * PW.dir;
  });
  const head = cols.map(([k, label, first]) => {
    const on = k === key;
    const next = on ? -PW.dir : first;
    return `<button class="th ${on ? "on" : ""} c-${k}" onclick="PW.sort='${k}';PW.dir=${next};renderPower()">
      ${label}${on ? `<span class="car">${PW.dir === 1 ? "&#9650;" : "&#9660;"}</span>` : ""}</button>`;
  }).join("");
  return `<div class="panel lt"><div class="lrowh">${head}</div>`
    + teams.map((t, i) => `<div class="lr ${t.rank <= 3 ? "top3" : ""}" style="${cvars(t.team)};--i:${i}">
        <div class="rk c-rank">${t.rank}</div>
        <div class="c-team tm">${badge(t.team, "sm")}<div><b>${esc(nick(t.team))}</b>
          <small>${esc(t.record || "")} &middot; ${esc(t.divname || "")}</small></div></div>
        <div class="c-wins num">${t.wins != null ? t.wins.toFixed(1) : "&ndash;"}</div>
        <div class="c-divodds">${odds(t.divodds, "g")}</div>
        <div class="c-playoff">${odds(t.playoff, "b")}</div>
        <div class="c-title">${odds(t.title, "o", titleMax())}</div>
      </div>`).join("") + `</div>`;
}
function renderPower(){
  const el = document.getElementById("tab-power");
  const all = DATA.power || [];
  if (!all.length){ el.innerHTML = `<div class="panel empty"><div class="big">Rankings coming soon</div></div>`; return; }
  const teams = all.filter(t => PW.conf === "All" || t.conf === PW.conf);
  let body;
  if (PW.view === "div"){
    const confs = PW.conf === "All" ? ["AFC", "NFC"] : [PW.conf];
    let n = 0;
    body = confs.map(c => `<div class="confh">${c}</div><div class="dgrid">`
      + DIVS.map(d => divCard(`${c} ${d}`, teams.filter(t => t.divname === `${c} ${d}`), n++)).join("")
      + `</div>`).join("");
  } else {
    body = leagueTable(teams);
  }
  el.innerHTML = section("Power rankings")
    + pwControls() + body;
}

/* Ranked bars, best first, one team color per bar, logo and value at the end.
   Values below zero draw left of a center line. */
function rankBars(rows, fmt, hi, o){
  o = o || {};
  rows = rows.filter(r => r.v != null).sort((a, b) => hi ? b.v - a.v : a.v - b.v);
  if (!rows.length) return noData();
  const vs = rows.map(r => r.v), dv = o.diverge || Math.min(...vs) < 0;
  const floor = o.floor != null ? o.floor : 0;
  const mx = Math.max(...vs.map(v => Math.abs(v - floor))) || 1;
  const room = dv ? 34 : 74;
  let rk = 0, prev = null;
  return `<div class="rbars ${dv ? "dv" : ""} ${o.names ? "nm" : ""}">` + rows.map((r, i) => {
    if (r.v !== prev) rk = i + 1;
    prev = r.v;
    const w = Math.max(0.6, room * Math.abs(r.v - floor) / mx), neg = dv && r.v < 0, c = team(r.t);
    const base = dv ? 50 : 0;
    const bar = neg ? `right:${base}%` : `left:${base}%`;
    const lab = neg ? `right:calc(${(base + w).toFixed(1)}% + 6px)` : `left:calc(${(base + w).toFixed(1)}% + 6px)`;
    const tip = (r.name ? r.name + ", " : "") + nick(r.t) + (o.lab ? ": " + o.lab(r) : "");
    return `<div class="rbr" style="--i:${i}" title="${esc(tip)}"><span class="rk">${rk}</span>
      ${o.names ? `<span class="pn">${esc(r.name)}</span>` : ""}
      <div class="rtrack"><div class="rb ${neg ? "neg" : "pos"}" style="--c1:${c[1]};--c2:${c[2]};${bar};width:${w.toFixed(1)}%"></div>
        <div class="rlab ${neg ? "neg" : ""}" style="${lab}">${logoImg(r.t)}<span>${fmt(r.v)}</span>${o.lab && !dv ? `<small>${o.lab(r)}</small>` : ""}</div></div></div>`;
  }).join("") + `</div>`;
}

function niceTicks(lo, hi, n){
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), e = raw / p;
  const st = (e < 1.5 ? 1 : e < 3 ? 2 : e < 7 ? 5 : 10) * p, out = [];
  for (let v = Math.ceil(lo / st) * st; v <= hi + st * 1e-6; v += st) out.push(+v.toFixed(8));
  return out;
}
function ext(a){ const lo = Math.min(...a), hi = Math.max(...a), pad = (hi - lo) * 0.1 || 0.05; return [lo - pad, hi + pad]; }

/* Scatter with team logos. o: xl, yl (axis labels), xf, yf (tick formats),

   bottom left, bottom right], names (player labels), hl (teams to highlight). */
function scatter(pts, o){
  pts = pts.filter(p => p.x != null && p.y != null);
  if (pts.length < 3) return noData();
  const W = Math.round(o.w || chartW()), sm = W < 560;
  const H = Math.round(Math.max(330, Math.min(620, W * (sm ? 1.0 : 0.6))));
  const m = {l: sm ? 44 : 52, r: o.names ? 60 : 18, t: 14, b: 44};
  const [x0, x1] = ext(pts.map(p => p.x)), [y0, y1] = ext(pts.map(p => p.y));
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const sx = v => m.l + (o.invX ? (x1 - v) : (v - x0)) / (x1 - x0) * iw;
  const sy = v => m.t + (o.invY ? (v - y0) : (y1 - v)) / (y1 - y0) * ih;
  let g = "";
  niceTicks(x0, x1, sm ? 4 : 6).forEach(v => {
    const x = sx(v).toFixed(1);
    g += `<line class="grid" x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ih}"/>
      <text x="${x}" y="${m.t + ih + 16}" text-anchor="middle">${o.xf(v)}</text>`;
  });
  niceTicks(y0, y1, 5).forEach(v => {
    const y = sy(v).toFixed(1);
    g += `<line class="grid" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"/>
      <text x="${m.l - 7}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${o.yf(v)}</text>`;
  });
  const mx = sx(avg(pts.map(p => p.x))).toFixed(1), my = sy(avg(pts.map(p => p.y))).toFixed(1);
  g += `<line class="mean" x1="${mx}" x2="${mx}" y1="${m.t}" y2="${m.t + ih}"/>
    <line class="mean" x1="${m.l}" x2="${m.l + iw}" y1="${my}" y2="${my}"/>`;
  const q = o.quads || [];
  const qt = (s, x, y, a) => s ? `<text class="q" x="${x}" y="${y}" text-anchor="${a}">${esc(s)}</text>` : "";
  if (!sm || !o.names) {
    g += qt(q[0], m.l + 10, m.t + 18, "start") + qt(q[1], m.l + iw - 10, m.t + 18, "end")
       + qt(q[2], m.l + 10, m.t + ih - 10, "start") + qt(q[3], m.l + iw - 10, m.t + ih - 10, "end");
  }
  g += `<text class="axl" x="${m.l + iw / 2}" y="${H - 6}" text-anchor="middle">${esc(o.xl)}</text>
    <text class="axl" transform="translate(12 ${m.t + ih / 2}) rotate(-90)" text-anchor="middle">${esc(o.yl)}</text>`;
  const s = o.names ? (sm ? 15 : 19) : (sm ? 22 : 30);
  const hl = o.hl, order = pts.slice().sort((a, b) => (hl ? hl.has(a.t) - hl.has(b.t) : 0));
  order.forEach((p, i) => {
    const x = sx(p.x), y = sy(p.y);
    const cls = hl ? (hl.has(p.t) ? "hl" : "dim") : "";
    const tip = `${p.name ? p.name + ", " : ""}${nick(p.t)}: ${o.xl} ${o.xf(p.x)}, ${o.yl} ${o.yf(p.y)}`;
    g += `<g class="pt ${cls}" style="--i:${i}"><title>${esc(tip.replace(/&ndash;/g, "-"))}</title>${svgLogo(p.t, x, y, hl && hl.has(p.t) ? s * 1.5 : s)}
      ${o.names ? `<text class="pl" x="${(x + s / 2 + 3).toFixed(1)}" y="${(y + 4).toFixed(1)}">${esc(p.name)}</text>` : ""}</g>`;
  });
  return `<svg class="sc" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.xl + " against " + o.yl)}">${g}</svg>`;
}

      <div><div class="mxl">${esc(label)}</div><div class="mxbars"><span class="a" style="width:${wa.toFixed(0)}%;background:${ca[1]};box-shadow:inset 0 0 0 1px ${ca[2]}"></span>
        <span class="h" style="width:${wh.toFixed(0)}%;background:${ch[1]};box-shadow:inset 0 0 0 1px ${ch[2]}"></span></div></div>
      <div class="mv r ${better === "h" ? "win" : ""}"><b>${vh == null ? "&ndash;" : fmt(vh)}</b><small>${rh ? "#" + rh : ""}</small></div></div>`;
  }).join("");
  const sel = `<select class="csel" onchange="CV.game=this.value;renderCharts()">${games.map(x =>
    `<option value="${esc(x.game_id)}" ${x.game_id === g.game_id ? "selected" : ""}>${esc(nick(x.away))} at ${esc(nick(x.home))}</option>`).join("")}</select>`;
  return cpanel("Matchup", "This week's games, side by side. League rank under each number; green marks the better one.",
      `<div class="mxhead"><div class="sd">${logoImg(g.away)}${esc(nick(g.away))}</div><div class="vs">AT</div>
        <div class="sd r">${esc(nick(g.home))}${logoImg(g.home)}</div></div>${rows}`, sel)
    + cpanel("Where they sit", "The two teams among the league's tiers.", quadrant(C, null, new Set([g.away, g.home])));
}

function renderCharts(){
  const el = document.getElementById("tab-charts");
  if (!el) return;
  const C = DATA.charts || {};
  if (!C.eff || !Object.keys(C.eff).length) {
    el.innerHTML = `<div class="panel empty"><div class="big">Charts return once games are played</div></div>`;
    return;
  }
  CV.w = chartW();
  const wk = (C.weeks || []).length ? (C.weeks[0] === C.weeks[1] ? `Week ${C.weeks[0]}` : `Weeks ${C.weeks[0]}-${C.weeks[1]}`) : "";
  const v = (val, label) => `<button class="seg ${CV.sec === val ? "on" : ""}" onclick="CV.sec='${val}';renderCharts()">${label}</button>`;
  const body = {tiers: chTiers, drives: chDrives, pass: chPass, run: chRun, tend: chTend,
                trend: chTrend, match: chMatch}[CV.sec](C);
  el.innerHTML = section("Charts", `${esc(wk)} &middot; ${C.season} regular season`)
    + `<div class="avbar"><div class="segs csegs">${CSECS.map(([k, l]) => v(k, l)).join("")}</div></div>` + body;
}
if (window.addEventListener) window.addEventListener("resize", () => {
  clearTimeout(window._crt);
  window._crt = setTimeout(() => { if (chartW() !== CV.w) renderCharts(); }, 150);
});


/* ---------- leaders ---------- */
function fmtNum(v){ return v == null ? "" : (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1)); }
function lrow(r, n){
  return `<div class="lrow"><span class="p">${n}</span>${badge(r.team, "sm")}
    <span class="ln">${esc(r.name)}</span><span class="v num">${fmtNum(r.value)}</span></div>`;
}
function renderLeaders(){
  const el = document.getElementById("tab-leaders");
  const L = DATA.leaders || {}, cats = (L.cats || []).filter(c => c.rows.length);
  if (!cats.length){ el.innerHTML = `<div class="panel empty"><div class="big">Leaders coming soon</div></div>`; return; }
  el.innerHTML = section("League leaders", L.through ? `Through week ${L.through}` : "")
    + `<div class="lgrid">` + cats.map((c, i) => {
      const [a, ...rest] = c.rows;
      return `<div class="panel lcard" style="--i:${i}"><h3>${esc(c.title)}</h3>
        <div class="lead1">${badge(a.team)}<div class="n">${esc(a.name)}<small>${esc(nick(a.team))}</small></div>
          <div class="v">${fmtNum(a.value)}</div></div>
        ${rest.slice(0, 4).map((r, j) => lrow(r, j + 2)).join("")}
        ${rest.length > 4 ? `<div class="more">${rest.slice(4).map((r, j) => lrow(r, j + 6)).join("")}</div>
          <button class="expand" aria-label="Show all ${c.rows.length}"
            onclick="this.parentNode.classList.toggle('open')">
            <span class="plus">+ All ${c.rows.length}</span><span class="minus">Top 5</span></button>` : ""}</div>`;
    }).join("") + `</div>`;
}

/* ---------- record ---------- */
function renderRecord(){
  const el = document.getElementById("tab-season");
  const R = DATA.record || {};
  const tiles = (R.tiles || []).map((t, i) => `<div class="panel tile ${t.record ? "" : "idle"}" style="--i:${i}">
      <div class="k">${esc(t.label)}</div><div class="v num">${t.record ? esc(t.record) : "0-0"}</div>
      <div class="s">${t.pct != null ? `${t.pct}% right` : "Nothing graded yet"}</div>
      <div class="bar2"><i style="width:${t.pct || 0}%"></i></div></div>`).join("");
  const weeks = (R.weeks || []).map(w => `<div class="panel wk"><div class="k">WEEK ${w.week}</div>
      <div class="v num">${esc(w.record)}</div></div>`).join("");
  el.innerHTML = section("Season record") + `<div class="tiles">${tiles}</div>`
    + vsBlock(R.vs) + linesBlock(DATA.lines)
    + (weeks ? section("Picks by week") + `<div class="weeks">${weeks}</div>` : "");
}

/* How the oddsmakers' lines perform, with ours beside them. */
function linesBlock(L){
  const S = (L || {}).season;
  if (!S || !S.games) return "";
  const m = S.margin, t = S.total, tl = S.their_lines;
  const pc = (k, n) => n ? Math.round(100 * k / n) + "%" : "&ndash;";
  const row = (lbl, us, them, better) => `<div class="lnrow"><span>${lbl}</span>
      <span class="rt ${better === "us" ? "win" : ""}">${us}</span>
      <span class="rt ${better === "them" ? "win" : ""}">${them}</span></div>`;
  const b = (a, c) => a == null || c == null ? "" : (a < c ? "us" : (c < a ? "them" : ""));
  const earned = ((L.gate || {}).our_lines_earned);
  return section("The oddsmakers' lines", `${S.games} graded games this season`)
    + `<div class="lngrid">
      <div class="panel lnside"><div class="k">Favorites covered</div>
        <div class="v num">${tl.favorites_covered}-${tl.favorites_of - tl.favorites_covered}</div>
        <div class="s">${pc(tl.favorites_covered, tl.favorites_of)}</div></div>
      <div class="panel lnside"><div class="k">Overs hit</div>
        <div class="v num">${tl.overs_hit}-${tl.overs_of - tl.overs_hit}</div>
        <div class="s">${pc(tl.overs_hit, tl.overs_of)}</div></div>
    </div>
    <div class="panel lntab"><div class="lnrow hd"><span>Average miss, points</span>
        <span class="rt">Our line</span><span class="rt">Theirs</span></div>
      ${row("Winning margin", m.our_avg_miss, m.their_avg_miss, b(m.our_avg_miss, m.their_avg_miss))}
      ${row("Total points", t.our_avg_miss, t.their_avg_miss, b(t.our_avg_miss, t.their_avg_miss))}
      ${row("Closer to the result", `${m.we_were_closer} of ${m.of}`, `${m.of - m.we_were_closer} of ${m.of}`,
            m.we_were_closer * 2 > m.of ? "us" : "them")}
    </div>
`;
}

/* Us against the oddsmakers: their pick is the favorite in their line. */
function vsBlock(V){
  if (!V || !V.n) return "";
  const pc = (w, n) => n ? Math.round(100 * w / n) : 0;
  const us = pc(V.us, V.n), them = pc(V.them, V.n);
  const side = (lbl, w, p, cls) => `<div class="panel vsside ${cls}">
      <div class="k">${lbl}</div><div class="v num">${w}-${V.n - w}</div>
      <div class="s">${p}% right</div><div class="bar2"><i style="width:${p}%"></i></div></div>`;
  const rows = V.weeks.map(w => {
    const a = pc(w.us, w.n), b = pc(w.them, w.n);
    const lead = w.us > w.them ? "us" : (w.us < w.them ? "them" : "even");
    return `<div class="vsrow"><div class="wkl">Week ${w.week}</div>
      <div class="vsbars">
        <div class="vb us"><span>Us</span><i style="width:${a}%"></i><b>${w.us}-${w.n - w.us}</b></div>
        <div class="vb them"><span>Odds</span><i style="width:${b}%"></i><b>${w.them}-${w.n - w.them}</b></div>
      </div><div class="vstag ${lead}">${lead === "us" ? "We won" : (lead === "them" ? "They won" : "Even")}</div></div>`;
  }).join("");
  return section("Us vs the oddsmakers")
    + `<div class="vsgrid">${side("Our picks", V.us, us, "us")}
        <div class="panel vsgap"><div class="k">${V.us === V.them ? "Level" : (V.us > V.them ? "We lead by" : "We trail by")}</div>
          <div class="v num ${V.us >= V.them ? "pos" : "neg"}">${Math.abs(V.us - V.them)}</div>
          <div class="s">${Math.abs(V.us - V.them) === 1 ? "game" : "games"}</div></div>
        ${side("Oddsmakers", V.them, them, "them")}</div>`
    + `<div class="panel vsweeks">${rows}</div>`
    ;
}

function renderFoot(){
  const d = new Date(DATA.generated);
  document.getElementById("foot").innerHTML = isNaN(d.getTime()) ? "" :
    `Updated ${d.toLocaleString("en-US", {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}`;
}

function show(name){
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === "tab-" + name));
  if (name === "charts" && chartW() !== CV.w) renderCharts();
  try { localStorage.setItem("tab", name); history.replaceState(null, "", "#" + name); } catch (e) {}
}
document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));

renderHero(); renderPicks(); renderBets(); renderProps(); renderPower(); renderAdvanced(); renderCharts(); renderLeaders(); renderRecord(); renderFoot();
/* A link can name a tab (#power, #ats, ...); otherwise reopen the last one. */
try {
  const h = (window.location && window.location.hash || "").slice(1);
  const t = h || localStorage.getItem("tab");
  if (t && document.getElementById("tab-" + t)) show(t);
} catch (e) {}
</script>
</body>
</html>
