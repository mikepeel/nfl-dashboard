<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<title>NFL Analytics</title>
<style>
:root{
  --ink:#0e1014; --surface:#161920; --surface-2:#1c2028;
  --line:#2a2f3a; --line-soft:#21252e;
  --text:#e9ebef; --dim:#98a0ae; --faint:#6b7382;
  --gold:#d4a44c; --gold-dim:#8a6c2f;
  --pos:#4ea87a; --neg:#d5675f;
  --radius:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);
  font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  background-image:radial-gradient(1100px 500px at 50% -10%,#1a1f2b 0%,var(--ink) 60%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 64px}
header{padding:22px 0 10px}
h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:650}
h1 span{color:var(--gold)}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  margin:30px 0 10px;font-weight:600}

/* freshness, first and loud */
.fresh{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:13px 15px;margin-top:6px}
.fresh .row{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:13px;color:var(--dim)}
.fresh b{color:var(--text);font-weight:600}
.fresh .k{color:var(--faint)}
.warn{margin-top:9px;padding:11px 13px;border-radius:9px;font-size:13.5px}
.warn.high{background:#2a1416;border:1px solid #6b2f33;color:#f2d7d5}
.warn.high b{color:#ff9b93;display:block;margin-bottom:2px}
.warn.medium{background:#241f10;border:1px solid #5c4a1f;color:#efe3c8}
.warn.medium b{color:var(--gold);display:block;margin-bottom:2px}
.ok{margin-top:9px;padding:10px 13px;border-radius:9px;font-size:13px;
  background:#132018;border:1px solid #2f5a44;color:#a9d9bf}

/* season tracker */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:13px 14px}
.stat .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-bottom:6px}
.stat .big{font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--dim);margin-top:3px}
.stat .sub.pos{color:var(--pos)} .stat .sub.neg{color:var(--neg)}
.stat.idle .big{color:var(--faint)}

/* picks list */
.game{display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line-soft);
  border-radius:10px;margin-bottom:7px}
.game .conf{font-size:12px;color:var(--faint);min-width:36px;text-align:center;
  font-variant-numeric:tabular-nums}
.game .fx{flex:1;min-width:0}
.game .teams{font-size:15px;font-weight:600;letter-spacing:-.01em}
.game .teams .picked{color:var(--gold)}
.game .teams .at{color:var(--faint);font-weight:400;margin:0 5px}
.game .meta{font-size:12px;color:var(--dim);margin-top:2px}
.game .res{font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap}
.res.won{color:var(--pos)} .res.lost{color:var(--neg)}
.res.pending{color:var(--faint);font-weight:500;letter-spacing:0;text-transform:none}

.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-block;padding:9px 14px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  text-decoration:none;font-size:14px}
.links a:hover{border-color:var(--gold-dim);color:var(--gold)}
footer{margin-top:34px;color:var(--faint);font-size:12px;line-height:1.6}
@media (max-width:560px){
  body{font-size:15px}
  .game{padding:11px 12px;gap:9px}
  .game .teams{font-size:14.5px}
  .stat .big{font-size:21px}
}
</style>
</head>
<body>
<div class="wrap">
<header><h1>NFL <span>Analytics</span></h1></header>
<div id="fresh"></div>
<h2>Season record</h2><div id="season" class="cards"></div>
<h2 id="wk-title">This week</h2><div id="games"></div>
<h2>Full reports</h2><div id="links" class="links"></div>
<footer id="foot"></footer>
</div>
<script>
const S = {"built_at": "2026-09-16T14:42:45Z", "weeks": [1], "current_week": 1, "current": {"week": 1, "picks_generated_at": "2026-09-09T13:49:08.825983+00:00", "picks_source": "reasoning run", "fallback_warning": null, "games_final": 16, "games_in_slate": 16, "graded": 16, "rows": [{"away": "CLE", "home": "JAX", "pick": "JAX", "confidence": 7, "predicted_margin": 8.72, "kickoff": "2026-09-13T17:00Z", "final": "10-34", "correct": true, "actual_margin": 24}, {"away": "WSH", "home": "PHI", "pick": "PHI", "confidence": 7, "predicted_margin": 9.28, "kickoff": "2026-09-13T20:25Z", "final": "22-24", "correct": true, "actual_margin": 2}, {"away": "NE", "home": "SEA", "pick": "SEA", "confidence": 6, "predicted_margin": 4.96, "kickoff": "2026-09-10T00:20Z", "final": "10-13", "correct": true, "actual_margin": 3}, {"away": "SF", "home": "LAR", "pick": "LAR", "confidence": 6, "predicted_margin": 6.09, "kickoff": "2026-09-11T00:35Z", "final": "27-7", "correct": false, "actual_margin": -20}, {"away": "NO", "home": "DET", "pick": "DET", "confidence": 6, "predicted_margin": 5.2, "kickoff": "2026-09-13T17:00Z", "final": "30-31", "correct": true, "actual_margin": 1}, {"away": "ARI", "home": "LAC", "pick": "LAC", "confidence": 6, "predicted_margin": 4.98, "kickoff": "2026-09-13T20:25Z", "final": "26-14", "correct": false, "actual_margin": -12}, {"away": "CHI", "home": "CAR", "pick": "CHI", "confidence": 5, "predicted_margin": -2.59, "kickoff": "2026-09-13T17:00Z", "final": "59-37", "correct": true, "actual_margin": -22}, {"away": "NYJ", "home": "TEN", "pick": "TEN", "confidence": 5, "predicted_margin": 5.15, "kickoff": "2026-09-13T17:00Z", "final": "23-10", "correct": false, "actual_margin": -13}, {"away": "DEN", "home": "KC", "pick": "KC", "confidence": 5, "predicted_margin": 2.19, "kickoff": "2026-09-15T00:15Z", "final": "10-31", "correct": true, "actual_margin": 21}, {"away": "BUF", "home": "HOU", "pick": "HOU", "confidence": 4, "predicted_margin": 3.28, "kickoff": "2026-09-13T17:0 "27-7", "correct": false, "actual_margin": -20}, {"away": "NO", "home": "DET", "pick": "DET", "confidence": 6, "predicted_margin": 5.2, "kickoff": "2026-09-13T17:00Z", "final": "30-31", "correct": true, "actual_margin": 1}, {"away": "ARI", "home": "LAC", "pick": "LAC", "confidence": 6, "predicted_margin": 4.98, "kickoff": "2026-09-13T20:25Z", "final": "26-14", "correct": false, "actual_margin": -12}, {"away": "CHI", "home": "CAR", "pick": "CHI", "confidence": 5, "predicted_margin": -2.59, "kickoff": "2026-09-13T17:00Z", "final": "59-37", "correct": true, "actual_margin": -22}, {"away": "NYJ", "home": "TEN", "pick": "TEN", "confidence": 5, "predicted_margin": 5.15, "kickoff": "2026-09-13T17:00Z", "final": "23-10", "correct": false, "actual_margin": -13}, {"away": "DEN", "home": "KC", "pick": "KC", "confidence": 5, "predicted_margin": 2.19, "kickoff": "2026-09-15T00:15Z", "final": "10-31", "correct": true, "actual_margin": 21}, {"away": "BUF", "home": "HOU", "pick": "HOU", "confidence": 4, "predicted_margin": 3.28, "kickoff": "2026-09-13T17:00Z", "final": "36-31", "correct": false, "actual_margin": -5}, {"away": "ATL", "home": "PIT", "pick": "PIT", "confidence": 4, "predicted_margin": 1.42, "kickoff": "2026-09-13T17:00Z", "final": "13-20", "correct": true, "actual_margin": 7}, {"away": "TB", "home": "CIN", "pick": "TB", "confidence": 3, "predicted_margin": -1.8, "kickoff": "2026-09-13T17:00Z", "final": "27-33", "correct": false, "actual_margin": 6}, {"away": "BAL", "home": "IND", "pick": "IND", "confidence": 3, "predicted_margin": 4.17, "kickoff": "2026-09-13T17:00Z", "final": "41-23", "correct": false, "actual_margin": -18}, {"away": "MIA", "home": "LV", "pick": "LV", "confidence": 3, "predicted_margin": 0.11, "kickoff": "2026-09-13T20:25Z", "final": "13-27", "correct": true, "actual_margin": 14}, {"away": "GB", "home": "MIN", "pick": "GB", "confidence": 3, "predicted_margin": -0.89, "kickoff": "2026-09-13T20:25Z", "final": "22-39", "correct": false, "actual_margin": 17}, {"away": "DAL", "home": "NYG", "pick": "NYG", "confidence": 3, "predicted_margin": 3.17, "kickoff": "2026-09-14T00:20Z", "final": "20-28", "correct": true, "actual_margin": 8}]}}, "season": {"straight_up": {"record": "9-7", "hit_rate": 0.562, "n": 16, "ci_low": 0.332}, "bets": {"ats": {"record": "2-9", "n": 11, "hit_rate": 0.182, "ci_low": 0.051, "break_even_reference": 0.524}, "moneyline": {"record": "3-8", "n": 11, "hit_rate": 0.273, "ci_low": 0.097, "break_even_reference": "per-bet"}, "total": {"record": "1-4", "n": 5, "hit_rate": 0.2, "ci_low": 0.036, "break_even_reference": 0.524}}, "props": {"n": 239, "wins": 113, "units": -24.56}, "weeks_recorded": 1}, "picks_generated_at": "2026-09-09T13:49:08.825983+00:00", "picks_age_hours": 168.9, "picks_source": "reasoning run", "warnings": [{"level": "high", "headline": "Picks were generated 169 hours ago", "detail": "Lines and injuries move. Re-run the weekly process."}]};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t ? esc(String(t).slice(0,16).replace("T"," ")) + " UTC" : "unknown";

/* Freshness first. A dashboard that quietly shows old numbers is worse than
   no dashboard, because you act on it. */
(function fresh(){
  const bits = [
    `<span class="k">Picks from</span> <b>${esc(S.picks_source || "unknown")}</b>`,
    `<span class="k">generated</span> <b>${when(S.picks_generated_at)}</b>`
      + (S.picks_age_hours != null ? ` <span class="k">(${S.picks_age_hours}h ago)</span>` : ""),
    `<span class="k">results through</span> <b>${(S.current||{}).games_final||0} of ${(S.current||{}).games_in_slate||0} games</b>`,
    `<span class="k">page built</span> <b>${when(S.built_at)}</b>`
  ];
  let h = `<div class="fresh"><div class="row">${bits.join("")}</div></div>`;
  for (const w of (S.warnings||[]))
    h += `<div class="warn ${w.level}"><b>${esc(w.headline)}</b>${esc(w.detail)}</div>`;
  if (!(S.warnings||[]).length)
    h += `<div class="ok">Everything on this page is current.</div>`;
  document.getElementById("fresh").innerHTML = h;
})();

(function season(){
  const q = S.season || {}, su = q.straight_up || {}, b = q.bets || {}, p = q.props || {};
  const pct = (w,n) => n ? (100*w/n).toFixed(1) + "%" : "-";
  const card = (lbl, big, sub, cls) =>
    `<div class="stat${big === "-" ? " idle" : ""}"><div class="lbl">${lbl}</div>
      <div class="big">${big}</div><div class="sub ${cls||""}">${sub}</div></div>`;
  const bet = (k, lbl) => {
    const v = b[k] || {};
    return card(lbl, v.n ? v.record : "-",
      v.n ? pct(parseInt(String(v.record).split("-")[0]||0), v.n) + " of " + v.n
          : "nothing graded");
  };
  document.getElementById("season").innerHTML =
    card("Who wins", su.n ? su.record : "-",
         su.n ? pct(su.n*su.hit_rate, su.n) + " of " + su.n : "nothing graded")
  + bet("ats", "Winning margin")
  + bet("total", "Total points")
  + card("Player props", p.n ? `${p.wins}-${p.n - p.wins}` : "-",
         p.n ? `${(p.units>0?"+":"")}${p.units} units` : "nothing graded",
         p.units > 0 ? "pos" : (p.units < 0 ? "neg" : ""));
})();

(function games(){
  const c = S.current || {}, rows = c.rows || [];
  document.getElementById("wk-title").textContent = `Week ${c.week||""} picks`;
  if (!rows.length){
    document.getElementById("games").innerHTML =
      `<div class="game"><div class="fx"><div class="meta">No picks yet for this week.</div></div></div>`;
    return;
  }
  document.getElementById("games").innerHTML = rows.map(r => {
    const team = t => t === r.pick ? `<span class="picked">${esc(t)}</span>` : esc(t);
    const res = r.correct == null
      ? `<span class="res pending">${r.final ? "ungraded" : "not played"}</span>`
      : `<span class="res ${r.correct ? "won" : "lost"}">${r.correct ? "won" : "lost"}</span>`;
    const meta = [];
    if (r.predicted_margin != null)
      meta.push(`we had ${esc(r.pick)} by ${Math.abs(r.predicted_margin).toFixed(1)}`);
    if (r.final) meta.push(`final ${esc(r.final)}`);
    return `<div class="game">
      <div class="conf mono">${r.confidence != null ? r.confidence + "/10" : ""}</div>
      <div class="fx"><div class="teams">${team(r.away)}<span class="at">at</span>${team(r.home)}</div>
        <div class="meta">${meta.join(" &middot; ")}</div></div>
      ${res}</div>`;
  }).join("");
})();

(function links(){
  document.getElementById("links").innerHTML = (S.weeks||[]).slice().reverse()
    .map(w => `<a href="week-${w}.html">Week ${w} full report</a>`).join("");
  document.getElementById("foot").innerHTML =
    `Built ${when(S.built_at)}. The full report for each week carries the game `
    + `detail, the betting and player prop pages, and the season diagnostics.`;
})();
</script>
</body>
</html>
