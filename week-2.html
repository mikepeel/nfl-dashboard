<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Week 2 Picks</title>
<style>
:root{
  --ink:#0e1014; --surface:#161920; --surface-2:#1c2028; --raised:#222732;
  --line:#2a2f3a; --line-soft:#21252e;
  --text:#e9ebef; --dim:#98a0ae; --faint:#6b7382;
  --gold:#d4a44c; --gold-dim:#8a6c2f;
  --pos:#4ea87a; --neg:#d5675f; --info:#5b8bd4;
  --radius:10px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ink); color:var(--text);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  background-image:radial-gradient(1200px 600px at 50% -10%, #1a1f2b 0%, var(--ink) 60%);
  background-attachment:fixed;
}
.mono{font-family:ui-monospace,Consolas,"SF Mono",Menlo,monospace;
  font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151922,#11141b)}
.hero-in{max-width:1080px;margin:0 auto;padding:26px 20px 20px}
.hero h1{margin:0}
.hero-sub{color:var(--faint);font-size:12.5px;margin-top:4px}
.hero-credit{display:none}
.head-in{max-width:1080px;margin:0 auto;padding:26px 20px 20px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:650}
h1 .wk{color:var(--gold)}
.head-meta{color:var(--faint);font-size:12.5px;text-align:right}

/* ---------- best bet ---------- */
.bestbet{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  margin:20px 0 4px;padding:16px 18px;border-radius:var(--radius);
  background:linear-gradient(135deg,#26201155,#1a1d26);
  border:1px solid var(--gold-dim);box-shadow:var(--shadow)}
.bestbet .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold-dim);padding:4px 9px;border-radius:99px;white-space:nowrap}
.bestbet .txt{font-size:15px}
.bestbet .warn{color:var(--dim);font-size:12.5px;flex-basis:100%}

/* ---------- provenance banner ---------- */
#provenance{margin:16px 0 0}
.pv-line{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;padding:9px 12px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:8px}
.pv-line b{color:var(--text);font-weight:600}
.pv-k{color:var(--faint)}
.pv-sep{color:var(--line);margin:0 2px}
.pv-warn{margin-top:8px;padding:11px 13px;border-radius:8px;font-size:13px;
  display:flex;gap:9px;flex-wrap:wrap;align-items:baseline}
.pv-warn.high{background:#2a1416;border:1px solid #6b2f33;color:#f2d7d5}
.pv-warn.high b{color:#ff9b93}
.pv-warn.medium{background:#241f10;border:1px solid #5c4a1f;color:#efe3c8}
.pv-warn.medium b{color:var(--gold)}
.pv-warn span{color:var(--dim)}
.matchup .picked{color:var(--gold)}

/* ---------- season tab ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:6px}
.tile{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:13px 14px}
.tile .tl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-bottom:6px}
.tile .tb{font-size:24px;font-weight:700;letter-spacing:-.02em}
.tile .ts{font-size:12px;color:var(--dim);margin-top:3px}
.tile .tn{color:var(--faint);font-size:11px;margin-top:3px;line-height:1.35}
.tile .ts.pos{color:var(--pos)} .tile .ts.neg{color:var(--neg)}
.tile.idle .tb{color:var(--faint)}
.confs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pi-conf{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);overflow:hidden;min-width:0}
.pi-conf-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);background:var(--surface-2);padding:8px 12px;
  border-bottom:1px solid var(--line-soft);font-weight:600}
.pi-row{display:grid;grid-template-columns:22px minmax(0,1fr) 42px 50px;gap:8px;
  align-items:center;padding:7px 12px;font-size:13.5px;
  border-bottom:1px solid var(--line-soft)}
.pi-row:last-child{border-bottom:none}
.pi-row.cut{border-bottom:2px solid var(--gold-dim)}
.pi-rk{color:var(--faint);font-size:11.5px}
.pi-row.pi-hd{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);padding-top:7px;padding-bottom:6px;font-weight:600}
.pi-row.pi-hd div{color:var(--faint)}
.pi-hd .pi-w,.pi-hd .pi-od{text-align:right;white-space:nowrap}
.pi-tm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pi-rec{color:var(--faint);font-weight:400;font-size:11.5px;margin-left:6px}
.pi-ix{text-align:right;font-size:12.5px}
.pi-ix.pos{color:var(--pos)} .pi-ix.neg{color:var(--neg)}
.pi-w{text-align:right;color:var(--dim);font-size:12.5px}
.pi-od{text-align:right;font-weight:700;font-size:13px}
.pi-od.hi{color:var(--pos)} .pi-od.mid{color:var(--text)}
.pi-od.lo{color:var(--dim)} .pi-od.out{color:var(--faint);font-weight:500}
@media (max-width:620px){ .confs{grid-template-columns:1fr} }

/* Power ranking table: current season only, so it carries the unit splits. */
.pr-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.pr{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.pr th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);font-weight:600;text-align:right;padding:7px 8px;
  border-bottom:1px solid var(--line)}
table.pr th.lf,table.pr td.lf{text-align:left}
table.pr td{padding:7px 8px;border-bottom:1px solid var(--line-soft);
  text-align:right;white-space:nowrap}
table.pr tbody tr:hover{background:var(--surface-2)}
table.pr .pr-rk{color:var(--faint);font-size:11.5px;width:26px}
table.pr .pr-tm{font-weight:600}
table.pr .pr-rec{color:var(--faint);font-weight:400;font-size:11.5px;margin-left:6px}
.rk{color:var(--faint);font-size:10.5px;margin-left:4px}
.na{color:var(--faint)}
.propgame h3 .at{color:var(--faint);font-weight:400;margin:0 6px}
.propgame h3 .kick{margin-left:12px;color:var(--faint);font-weight:400;
  font-size:12.5px;letter-spacing:0;text-transform:none}
.sec-sub{color:var(--faint);font-weight:400;font-size:12px;letter-spacing:0;
  text-transform:none;margin-left:8px}
details.note{margin:-4px 0 12px}
details.notice{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:10px 14px;margin:0 0 14px}
details.notice[open]{padding-bottom:12px}
details.notice > summary{color:var(--gold);font-weight:600}
details.notice p{margin:8px 0 0;color:var(--dim);font-size:12.5px}
ul.dc{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--dim);
  columns:2;column-gap:26px}
ul.dc li{margin-bottom:2px;break-inside:avoid}
ul.dc .yes{color:var(--pos)} ul.dc .no{color:var(--neg)}
@media (max-width:620px){ ul.dc{columns:1} }
details.note summary{cursor:pointer;color:var(--gold);font-size:12.5px;
  list-style:none;display:inline-block;
  border-bottom:1px dotted var(--gold-dim);padding-bottom:1px}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"+ ";font-weight:600}
details.note[open] summary::before{content:"- "}
details.note[open] summary{margin-bottom:6px}
details.note > :not(summary){font-size:12.5px;color:var(--dim);
  border-left:2px solid var(--line);padding-left:10px}
details.note{font-size:12.5px;color:var(--dim)}
a.tablink{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-dim)}
a.tablink:hover{border-bottom-color:var(--gold)}
.dimcol{color:var(--dim)}
.ctx-flag{display:inline-block;margin-left:7px;font-size:10px;font-weight:600;
  color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;
  padding:0 4px;vertical-align:1px;cursor:help}
.ctxbox{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:12px 14px;margin-top:12px}
.ctxbox-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);font-weight:600;margin-bottom:6px}
.ctxbox p{color:var(--dim);font-size:12.5px;margin:0 0 8px}
.ctxbox ul{margin:0;padding-left:18px;font-size:13px}
.ctxbox li{margin-bottom:5px}
.ctxbox table.plain{margin-top:6px}
b.warn{color:var(--gold)}
b.pos{color:var(--pos)} b.neg{color:var(--neg)}

/* ---------- notice ---------- */
.notice{margin:18px 0;padding:14px 16px;border-radius:var(--radius);
  background:#1a1520;border:1px solid #3a2a33;color:#e7d9d7;font-size:13.5px}
.notice b{color:var(--neg)}
.notice ul{margin:8px 0 0;padding-left:18px;color:var(--dim)}

/* ---------- tabs ---------- */
nav{position:sticky;top:0;z-index:5;background:rgba(14,16,20,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:none;color:var(--dim);font:inherit;font-size:13.5px;
  padding:13px 15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab{display:none;padding:22px 0 60px}
.tab.active{display:block}

/* ---------- game cards ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .15s}
.card:hover{border-color:var(--line)}
.card-head{display:grid;grid-template-columns:64px 1fr auto auto auto;gap:20px;
  align-items:center;padding:15px 18px;cursor:pointer}
.rankno{font-size:20px;color:var(--faint);font-weight:600;
  display:flex;align-items:center;justify-content:flex-end;gap:6px}
.rankno .rn{min-width:18px;text-align:right}
.gmark{font-size:15px;line-height:1;font-weight:700;cursor:help}
.gmark.gwon{color:var(--pos)} .gmark.glost{color:var(--neg)}
.matchup{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.matchup .at{color:var(--faint);font-weight:400;margin:0 5px}
.sub{color:var(--dim);font-size:12.5px;margin-top:3px}
.pickbox{text-align:right}
.theirbox{text-align:right;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:8px;padding:8px 12px;min-width:104px}
.confbox{text-align:right;border-left:1px solid var(--line);padding-left:22px;min-width:118px}
.pick{font-size:17px;font-weight:700;color:var(--gold);letter-spacing:.01em}
.pick.theirs{color:var(--dim);font-weight:600}
.picklabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.disagree{display:inline-block;margin-top:5px;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:#e2b7b2;background:#2a1c1e;border:1px solid #4a3033;
  padding:2px 8px;border-radius:99px}

/* confidence meter */
.conf{display:flex;align-items:center;gap:7px;margin-top:4px;justify-content:flex-end}
.bars{display:flex;gap:2px}
.bars i{width:5px;height:13px;border-radius:1px;background:#2b313d;display:block}
.bars i.on{background:var(--gold)}
.bars i.on.lo{background:#7c6a45}
.confnum{font-size:11.5px;color:var(--dim)}

/* factor chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 15px}
.chip{font-size:11.5px;padding:3.5px 9px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--dim);cursor:help}
.chip.key{border-color:#3b4457;color:#c6cfdf;background:#1f2531}
.chip.gap{border-color:#463037;color:#d9b3ae;background:#241a1d}

/* expanded body */
.body{display:none;border-top:1px solid var(--line-soft);background:var(--surface-2);padding:16px 18px}
.body.open{display:block}
.body p{margin:0 0 14px;color:#d5dae2}
.brk{width:100%;border-collapse:collapse;font-size:13px}
.brk th{text-align:left;color:var(--faint);font-weight:500;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.brk td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.brk td.n{text-align:right;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
.brk td.d{color:var(--dim);font-size:12.5px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--faint)}
.inactive td{color:var(--faint);font-style:italic}

/* ---------- bet pills ---------- */
.pill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--dim)}
.pill.play{border-color:#2f5a44;background:#16241d;color:#93d6b2}
.pill.none{opacity:.55}
.betgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 18px 15px}
.betcell{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px}
.betcell .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.betcell .v{font-size:13.5px}
.betcell .why{font-size:11.5px;color:var(--dim);margin-top:4px}

/* ---------- glossary ---------- */
.gloss{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:6px 20px;box-shadow:var(--shadow)}
.gloss dt{font-weight:650;margin:16px 0 4px;color:var(--gold)}
.gloss dd{margin:0 0 14px;color:var(--dim);font-size:13.5px}
.lead{color:var(--dim);font-size:13.5px;margin:0 0 18px;max-width:70ch}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin:26px 0 12px}
.empty{color:var(--faint);padding:40px 0;text-align:center}
/* ---------- player props, grouped by game ---------- */
.propgame{margin:0 0 26px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.propgame > h3{margin:0;padding:13px 16px;font-size:15px;font-weight:600;
  letter-spacing:-.01em;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
.propgame > h3 .at{color:var(--faint);font-weight:400;margin:0 6px}
.propgame > h3 .kick{float:right;color:var(--faint);font-size:11.5px;font-weight:400}
table.props{width:100%;border-collapse:collapse;font-size:13px}
table.props caption{caption-side:top;text-align:left;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:11px 16px 7px;font-weight:600}
table.props.over caption{color:#93d6b2}
table.props.under caption{color:#e2b7b2}
table.props th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;padding:6px 10px;border-top:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft)}
table.props.over th{background:#16241d;color:#7fc4a2}
table.props.under th{background:#2a1c1e;color:#d3a49f}
table.props td{padding:8px 10px;border-bottom:1px solid var(--line-soft);color:#d5dae2}
table.props tr:last-child td{border-bottom:none}
table.props td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.props td.player{font-weight:600}
table.props td.prop{line-height:1.35}
table.props .propline{display:block;font-weight:600;color:var(--text)}
table.props .propctx{display:block;font-size:11.5px;color:var(--dim)}
table.props td.sec2{font-size:11.5px;white-space:nowrap}
table.props td.call{white-space:nowrap;font-size:11.5px}
table.props tr.grouphead th{background:transparent;border-top:none;border-bottom:none;
  color:var(--faint);font-size:9.5px;letter-spacing:.12em;padding:9px 10px 2px;
  text-align:center;font-weight:600}
table.props tr.grouphead th[colspan="3"]{border-bottom:1px solid var(--line-soft)}
table.props th.rt{text-align:right}
table.props td.two{line-height:1.3}
table.props td.two .big{display:block;font-weight:600;color:var(--text);font-size:13.5px}
table.props td.two .small{display:block;font-size:10.5px;color:var(--faint)}
table.props td.player .pos{display:block;font-size:10.5px;color:var(--faint);font-weight:400}
table.props td.matchup-cell{white-space:nowrap;font-size:12px;color:var(--dim)}
table.props td.matchup-cell .vs{color:var(--faint);font-size:10.5px}
.exch{font-weight:600;font-size:13.5px;border-bottom:1px dotted transparent;cursor:help}
.exch.agree{color:var(--pos);border-bottom-color:var(--pos)}
.exch.against{color:var(--neg);border-bottom-color:var(--neg)}
.nomkt{color:var(--faint);font-size:11.5px;cursor:help;border-bottom:1px dotted var(--line)}
table.plain.legend td{vertical-align:top;padding:7px 14px 7px 0;font-size:12.5px;color:var(--dim)}
table.plain.legend td:first-child{white-space:nowrap;color:var(--text)}
table.plain.legend{margin-bottom:20px}
/* top plays table: same column language as the board, tuned for a short list */
table.props.top{background:var(--surface);border:1px solid var(--gold-dim);
  border-radius:var(--radius);overflow:hidden;margin-bottom:6px;box-shadow:var(--shadow)}
table.props.top th{background:#241d10;color:#d8b978}
table.props.top tr.grouphead th{background:transparent;color:var(--faint)}
table.props.top tr.toprow{cursor:pointer}
table.props.top tr.toprow:hover td{background:rgba(212,164,76,.06)}
table.props.top td{padding:11px 10px}
table.props.top td .callplay{font-size:12.5px}
table.props.top td.num .small{display:block;font-size:10.5px;color:var(--faint);
  margin-top:3px;font-weight:400}
tr.whyrow td{padding:0;border-bottom:none}
.why-body{display:none;padding:0 12px 14px;color:#d5dae2;font-size:13px;max-width:88ch}
.why-body.open{display:block}
.why-body p{margin:0 0 8px}
.why-body .caution{color:var(--dim);font-size:12.5px}
.lead.tighter{margin:0 0 22px;font-size:12px;color:var(--faint)}
.conf-hi{font-weight:700;font-size:14px;color:var(--pos);cursor:help;
  border-bottom:1px dotted var(--pos)}
.conf-mid{font-weight:600;font-size:13.5px;color:var(--text);cursor:help;
  border-bottom:1px dotted var(--line)}
.conf-lo{font-weight:500;font-size:13px;color:var(--dim);cursor:help;
  border-bottom:1px dotted var(--line)}
.gap-good{font-weight:700;color:var(--pos);cursor:help;font-size:13px}
.gap-bad{color:var(--neg);cursor:help;font-size:12.5px;opacity:.8}
.gap-same{color:var(--faint);cursor:help;font-size:11.5px}
table.plain.tracker{margin-bottom:14px}
table.plain.tracker th{padding-bottom:8px}
table.plain.tracker td{padding:8px 12px 8px 0}
table.plain.tracker td.num{text-align:right}
table.plain.tracker th.rt{text-align:right}
table.plain.tracker tr.idle td{color:var(--faint)}
.tnote{color:var(--faint);font-size:11.5px}
.won{color:var(--pos);font-weight:600}
.lost{color:var(--neg);font-weight:600}
.pushed{color:var(--dim)}
.tinj{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#e2b7b2;
  background:#2a1c1e;border:1px solid #4a3033;padding:2px 7px;border-radius:99px;cursor:help}
.tpub{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold-dim);padding:2px 7px;border-radius:99px}
.callplay{display:inline-block;font-weight:700;color:var(--gold);
  border:1px solid var(--gold-dim);background:#26201155;padding:2px 8px;border-radius:99px}
table.props tr.named-play{background:rgba(212,164,76,.10)}
table.props tr.named-play td{border-bottom-color:var(--gold-dim)}
table.props tr.passed td.player,
table.props tr.passed td.prop{opacity:.6}
table.props tr.picked{background:rgba(212,164,76,.08)}
.tickmark{display:inline-block;margin-left:7px;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);
  padding:1px 6px;border-radius:99px;vertical-align:1px}

uch of last season's playing time returns this year, weighted by snaps. A team returning 90% of its snaps is described far better by last year's numbers than one returning 50%."}, "market_signal:line_available": {"label": "Oddsmakers' line", "explain": "What the professional bookmakers are offering on this game, used as a reference point. They price in current information our model cannot see."}, "declared_adjustment:coordinator_change": {"label": "Coaching change", "explain": "A manual adjustment for a coordinator or scheme change, which no statistical feed captures. Every one is documented with its evidence and expires as real data arrives."}, "pass_unit_rank_mismatch": {"label": "Big passing mismatch", "explain": "One side's passing unit outranks the other's by ten or more places."}, "rush_unit_rank_mismatch": {"label": "Big running mismatch", "explain": "One side's running unit outranks the other's by ten or more places."}, "model_market_conflict": {"label": "We disagree with the oddsmakers", "explain": "Our model and the professional line are five or more points apart on this game. Treated as a warning rather than an opportunity: when we are that far from them, they are usually the ones who turn out to be right."}, "props:target_share": {"label": "Share of his team's throws", "explain": "How much of his team's passing work this player takes. The most reliable thing we know about a receiver: it carries from one season to the next far better than anything about how well he plays."}, "props:carry_share": {"label": "Share of his team's runs", "explain": "How much of his team's running work this back takes. Like target share, it is the stable part of a player's value."}, "props:injury_vacancy": {"label": "Work left by an injured team-mate", "explain": "A team-mate at his position is ruled out, so his carries or targets are expected to go to the players who remain. One of the few things that genuinely moves a player's numbers in a single week."}, "props:matchup_pass_defence": {"label": "The pass defense he faces", "explain": "The opposing pass defense, adjusted for the quality of offenses it has faced. Worth roughly twelve percent either way at the league's extremes, so it shades a projection rather than deciding it."}, "props:matchup_run_defence": {"label": "The run defense he faces", "explain": "The opposing run defense, adjusted for the offenses it has faced."}, "props:new_team": {"label": "He changed teams", "explain": "He is on a different team from last season, so his expected share of the work is an estimate on a depth chart this model has never seen him play in. Treated as a reason for less confidence, not more."}, "props:model_lean": {"label": "Unusual even for our model", "explain": "Our model currently sits below the oddsmakers on almost every player prop. This one stands out even after allowing for that, which makes it a genuine disagreement rather than a repeat of the same one."}, "data_gap:props_never_backtested": {"label": "Never tested against results", "explain": "The player props model has not yet been graded against a single real week. Everything on this page is a first run, and scores are held down accordingly until there is a record to judge them by."}, "props:sharp_line_gap": {"label": "Better than the market maker's number", "explain": "The line on offer sits on the favorable side of the one Pinnacle deals. Pinnacle is a market maker: it sets its own numbers, takes the largest bets, and most other books wait to see it before posting. Getting five yards better than its number is an edge that exists before our own model says anything at all."}, "data_gap:no_second_opinion": {"label": "Not checked against a second venue", "explain": "No market on the Kalshi exchange matches this exact number, so this play rests on one bookmaker alone. Where a match did exist, the exchange and the bookmaker agreed with each other and disagreed with our model 51 times out of 53, so an unchecked play is unverified rather than confirmed."}, "second_opinion:exchange_agrees": {"label": "A second venue agrees with us", "explain": "An independent prediction market with real money in it prices this close to where our model does. The rarest and most encouraging shape on the page: it means the disagreement is with one bookmaker rather than with the market as a whole."}, "second_opinion:both_venues_against": {"label": "Both venues disagree with us", "explain": "A bookmaker and an independent exchange both price this against our model, and they agree with each other. Two venues with different customers and separate price discovery do not land on the same number by accident, so this usually means our projection is the thing that is wrong."}, "data_gap:single_bookmaker": {"label": "One bookmaker only", "explain": "Prop lines come from one book, so there is no consensus to compare against and no sign of whether a line has moved. Books disagree far more on props than on game lines, so a single quote is thinner evidence than it looks."}, "data_gap:no_preseason_role_news": {"label": "No camp or preseason information", "explain": "Nothing in these feeds carries training camp or preseason news, which before week 1 is the largest single thing the model cannot see. The oddsmakers can see it, and it is the most likely reason they and we disagree about who plays."}, "data_gap:no_injury_report": {"label": "No injury data yet", "explain": "Injury reports have not been published for this season, so injuries contributed nothing. Not the same as a clean bill of health."}, "data_gap:no_current_season_form": {"label": "No games played yet", "explain": "No current-season results exist, so everything leans on last year."}, "rest:home_extra_rest": {"label": "Home team better rested", "explain": "The home team has had materially more days off than the visitor, usually off a bye or a Thursday game. Worth a fraction of a point in the model, not the several points it is often credited with."}, "rest:away_extra_rest": {"label": "Visitor better rested", "explain": "The visiting team has had materially more days off than the home team. Same small size as the reverse case."}, "rest_and_travel": {"label": "Rest and travel", "explain": "Days off since each team's last game, plus how far the visitor traveled. Both are real and both are small: travel is worth about a tenth of a point per 250 miles in this model."}, "engine:early_season_weighting": {"label": "This season barely counts yet", "explain": "Our model blends this season with last, and this early it is still mostly last season. So a strong or weak start is only lightly reflected in the projection, and where that start looks meaningful we say so on the pick rather than leaving it buried."}, "data_gap:momentum_inactive_offseason": {"label": "Momentum switched off", "explain": "How a team finished last season does not predict how it starts the next one, so that input is disabled until games are played."}}, "breakdown": {"pass_matchup": {"label": "Passing matchup", "explain": "Points from the passing game on both sides."}, "rush_matchup": {"label": "Running matchup", "explain": "Points from the run game on both sides."}, "turnover_margin": {"label": "Turnovers", "explain": "Takeaways against giveaways, heavily discounted."}, "momentum": {"label": "Recent form", "explain": "How each team has trended over its last four games."}, "home_field": {"label": "Home field", "explain": "League-average home advantage."}, "rest": {"label": "Rest", "explain": "Days off, compared between the two teams."}, "travel": {"label": "Travel", "explain": "How far the visiting team traveled."}, "injuries": {"label": "Injuries", "explain": "Cost of players out or limited, weighted by position."}, "declared_adjustment": {"label": "Coaching change", "explain": "Manual adjustment, documented separately."}, "scoring_baseline": {"label": "Expected scoring", "explain": "Both teams' scoring and defensive rates."}, "weather": {"label": "Weather", "explain": "Wind and precipitation, which suppress scoring."}}, "glossary": [{"term": "Our model vs the oddsmakers", "definition": "Two different opinions, shown side by side everywhere on this site. \"Our model\" is this system: it rates every team from how efficiently they played, adjusts for who they played, and projects a score. \"The oddsmakers\" are the professional bookmakers who set the betting lines. When the two columns differ, that is us disagreeing with them, and they are right more often than we are."}, {"term": "Projected margin", "definition": "How much our model expects the home team to win this game by. A positive number means the home team; a negative one means the visiting team wins."}, {"term": "The line, or the spread", "definition": "The oddsmakers' version of the same number. Quoted the same way here so you can compare it directly against ours."}, {"term": "Winning margin bet (also called the spread, or ATS)", "definition": "A bet on how much a team wins or loses by, not on who wins. If a team is favored by 7, backing them means they need to win by 8 or more. Backing the other side means they can lose by 6 and you still collect."}, {"term": "Total points bet (also called the over/under)", "definition": "A bet on both teams' scores added together landing above or below a number the oddsmakers set. Nothing to do with who wins."}, {"term": "Who-wins bet (also called the moneyline)", "definition": "A bet on the winner, with the margin irrelevant. The price tells you the payout: -150 means you risk 150 to make 100 on a favorite, +150 means you risk 100 to make 150 on an underdog."}, {"term": "Why we sometimes suggest backing a team we expect to lose", "definition": "Because the two pages answer different questions. The picks page says who we expect to win. The betting page says whether the price is worth taking. On a big underdog those come apart: if the oddsmakers are paying +425 on a team our model rates far better than that price suggests, the bet is generously priced even though we still expect that team to lose the game. We always say so outright when that happens. Treat it as a longshot worth a small stake, not as a prediction."}, {"term": "Confidence, 1 to 10", "definition": "How much weight to put on a pick, not how big a win we expect. It is held down when the inputs are thin, for example before injury reports are published, no matter how lopsided the game looks."}, {"term": "Nothing to bet", "definition": "The normal and expected answer. It means our model and the oddsmakers are close enough on that game that there is no reason to put money on it."}, {"term": "Efficiency, or EPA per play", "definition": "How much each play actually improved a team's position, rather than just counting yards. A 3-yard gain on third-and-2 is worth far more than a 10-yard gain on third-and-20, and this measures that difference."}, {"term": "Adjusted for opponent", "definition": "Corrected for schedule strength. Numbers piled up against weak teams get marked down, and numbers earned against strong ones get credit."}, {"term": "Player prop", "definition": "A bet on one player's own numbers rather than on the game: how many catches he makes, how many yards he gains. Winning it has nothing to do with who wins the game."}, {"term": "Over and under, on a player", "definition": "The oddsmakers post a number, such as 4.5 catches, and you back the player to finish above it or below it. Half a catch is not possible, so the half-point exists purely to stop a tie."}, {"term": "Share of the work", "definition": "How much of a team's passing or running a player takes on. It is the most predictable thing about him: how much he plays carries from year to year far better than how well he plays does."}, {"term": "Why so many of our prop numbers sit below the oddsmakers'", "definition": "Before the season starts this model has no information about 2026 at all: no training camp, no preseason, no sense of who has won a job. So it pulls every player back toward what an average player at his position does, while the oddsmakers are pricing the roles those players actually hold today. That makes our numbers lower across the board. It is one disagreement repeated hundreds of times, not hundreds of opportunities, and the page treats it that way."}, {"term": "Roster continuity", "definition": "How much of last season's playing time is back this year. A team returning nearly everyone is described well by last year's numbers; one that rebuilt is not, so we trust its old numbers less."}]};

const nn = (v, digits) => (v === null || v === undefined ||
  (typeof v === "number" && !isFinite(v)))
  ? '<span class="na">-</span>'
  : (typeof v === "number" && digits !== undefined ? v.toFixed(digits) : esc(v));
const esc0 = s => String(s == null ? "" : s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sign = n => (n > 0 ? "+" : "") + Number(n).toFixed(1);
const cls = n => n > 0.05 ? "pos" : (n < -0.05 ? "neg" : "zero");

function factorChip(key){
  const m = (LAB.factors || {})[key];
  const label = m ? m.label : key.split(":").pop().replace(/_/g," ");
  const tip = m ? m.explain : "";
  const kind = key.startsWith("data_gap") ? "gap"
             : (key.indexOf("mismatch") > -1 || key.indexOf("conflict") > -1
                || key.indexOf("declared") > -1) ? "key" : "";
  return `<span class="chip ${kind}" title="${esc(tip)}">${esc(label)}</span>`;
}

function meter(conf){
  let b = "";
  for (let i = 1; i <= 10; i++)
    b += `<i class="${i <= conf ? "on" + (conf <= 3 ? " lo" : "") : ""}"></i>`;
  return `<div class="picklabel">How sure we are</div>
          <div class="conf"><div class="bars">${b}</div>
          <span class="confnum">${conf}/10</span></div>`;
}

function breakdownTable(rows){
  if (!rows || !rows.length) return "";
  const active = rows.filter(f => f.active && Math.abs(f.points) >= 0.05);
  const off = rows.filter(f => !f.active);
  let html = `<table class="brk"><thead><tr><th>What went into this</th>
    <th style="text-align:right">Points</th><th>Detail</th></tr></thead><tbody>`;
  active.sort((a,b) => Math.abs(b.points) - Math.abs(a.points)).forEach(f => {
    const m = (LAB.breakdown || {})[f.name] || {};
    html += `<tr><td title="${esc(m.explain||"")}">${esc(m.label || f.name)}</td>
      <td class="n ${cls(f.points)}">${sign(f.points)}</td>
      <td class="d">${esc(f.detail||"")}</td></tr>`;
  });
  off.forEach(f => {
    const m = (LAB.breakdown || {})[f.name] || {};
    html += `<tr class="inactive"><td>${esc(m.label || f.name)}</td>
      <td class="n">not used</td><td class="d">${esc(f.detail||"")}</td></tr>`;
  });
  return html + "</tbody></table>";
}


/* ---------- season ----------
   The tab this page opens on, and the only one that answers "how is the whole
   thing going" rather than "what happened in one week".

   It was a separate page for about a day. That was the wrong shape: the
   published URL served a summary while every detailed tab sat behind a link
   at the bottom, so opening the app on a phone gave you a landing page
   instead of the app. One page, season view first. */
function renderPower(){
  const el = document.getElementById("tab-power");
  /* Power index and playoff odds, by conference. A playoff race is a
     within-conference question, and one 32-team list invites comparing teams
     that never compete for the same place. */
  let h = "";
  const P = DATA.power;
  if (P && (P.teams||[]).length){
    const band = x => x >= .75 ? "hi" : x >= .40 ? "mid" : x >= .15 ? "lo" : "out";
    const conf = name => {
      const rows = P.teams.filter(t => t.conference === name)
                          .sort((a,b) => b.playoff_odds - a.playoff_odds);
      return `<div class="pi-conf"><div class="pi-conf-h">${name}</div>
        <div class="pi-row pi-hd"><div class="pi-rk">#</div><div class="pi-tm">Team</div>
          <div class="pi-w">Wins</div>
          <div class="pi-od">Playoff</div></div>` + rows.map((t,i) => `
        <div class="pi-row${i===6 ? " cut" : ""}">
          <div class="pi-rk mono">${i+1}</div>
          <div class="pi-tm">${esc(t.team)}<span class="pi-rec">${esc(t.record)}</span></div>
          <div class="pi-w mono">${t.projected_wins.toFixed(1)}</div>
          <div class="pi-od ${band(t.playoff_odds)} mono">${Math.round(100*t.playoff_odds)}%</div>
        </div>`).join("") + `</div>`;
    };
    /* The full ranking, all 32, with the unit splits. This is the
       descriptive number: current season only, nothing carried over from
       last year. A dash means the sample is still too small for that column
       to mean anything, which is honest and better than a made-up rank. */
    const num = (v,d) => v===null||v===undefined ? '<span class="na">-</span>'
      : (v>0?"+":"") + v.toFixed(d===undefined?1:d);
    const withRank = (v,r,d) => v===null||v===undefined
      ? '<span class="na">-</span>'
      : num(v,d) + (r ? `<span class="rk">#${r}</span>` : "");
    const all = P.teams.slice().sort((a,b) =>
      (b.power_index===null?-99:b.power_index) - (a.power_index===null?-99:a.power_index));

    const pw = P.prior_config || {};
    const ctx = P.context || {};
    const applied = ctx.applied || [];

    h += `<h2 class="sec">Power ranking <span class="sec-sub">through week ${
        P.through_week || "-"}</span></h2>
      <p class="lead">Points better than an average team, <b>on this season
      alone</b>. Who is winning right now, so it moves week to week.
      <b>Projected</b> beside it weighs two seasons and drives the playoff
      odds, which is why the two columns disagree.</p>
      <details class="note"><summary>What the columns mean</summary>
        <b>Rating</b> blends this season with last at a measured weight: last
        season counts as ${pw.prior_games ? pw.prior_games.toFixed(0) : "9"}
        games and carries ${pw.carryover ? Math.round(100*pw.carryover) : 48}%
        of its spread forward. We tested the alternatives against real results
        and both were worse at predicting games not yet played: this season
        alone, and last season alone. That is why one bad Sunday moves a team a
        few places rather than twenty.<br>
        <b>This year</b> is the same rating with last season stripped out.
        <b>Offense</b> is points scored against what those opponents usually
        give up, <b>defense</b> the reverse, <b>schedule</b> how good the
        opponents have been. Those three are this season only and stay blank
        until the sample can carry them.</details>
      <div class="pr-wrap"><table class="pr"><thead><tr>
        <th class="lf">#</th><th class="lf">Team</th>
        <th>Now</th><th>Projected</th><th>Margin/g</th>
        <th>Pts/g</th><th>Allowed/g</th>
        <th>Offense</th><th>Defense</th><th>Schedule</th><th>G</th>
      </tr></thead><tbody>` + all.map((t,i) => `
        <tr><td class="lf pr-rk mono">${i+1}</td>
          <td class="lf pr-tm">${esc(t.team)}<span class="pr-rec">${esc(t.record)}</span>${
            t.context_points ? `<span class="ctx-flag" title="${esc(t.context_reason||"")}">${
              t.context_points>0?"+":""}${t.context_points.toFixed(1)} context</span>` : ""}</td>
          <td class="mono ${t.power_index>0?"pos":t.power_index<0?"neg":""}"><b>${num(t.power_index)}</b></td>
          <td class="mono dimcol">${num(t.projected_strength)}</td>
          <td class="mono dimcol">${num(t.margin_per_game)}</td>
          <td class="mono">${t.points_for_pg===null||t.points_for_pg===undefined
            ? '<span class="na">-</span>' : t.points_for_pg.toFixed(1)}</td>
          <td class="mono">${t.points_against_pg===null||t.points_against_pg===undefined
            ? '<span class="na">-</span>' : t.points_against_pg.toFixed(1)}</td>
          <td class="mono">${withRank(t.offense, t.offense_rank)}</td>
          <td class="mono">${withRank(t.defense, t.defense_rank)}</td>
          <td class="mono">${withRank(t.strength_of_schedule, t.sos_rank)}</td>
          <td class="mono">${t.games_played_srs===null||t.games_played_srs===undefined
            ? '<span class="na">-</span>' : t.games_played_srs}</td>
        </tr>`).join("") + `</tbody></table></div>`;

    /* Anything judgement moved, spelled out. An adjustment nobody can see is
       a thumb on the scale, so the page names every one or says there were
       none. */
    if (applied.length){
      h += `<div class="ctxbox"><div class="ctxbox-h">Context we added by hand</div>
        <p>Things no result has shown yet. Each moves the rating by the points
        shown and expires on the week given.</p>
        <ul>` + applied.map(a => `<li><b>${esc(a.team)}</b>
          <span class="mono ${a.points>0?"pos":"neg"}">${a.points>0?"+":""}${
            a.points.toFixed(1)}</span>
          ${esc(a.reason)} <span class="na">(through week ${a.through_week})</span></li>`).join("")
        + `</ul></div>`;
    } else {
      h += `<p class="lead na">No hand adjustments this week.</p>`;
    }

    h += `<h2 class="sec">Playoff odds</h2>
      <p class="lead">Chance of making the playoffs. The line marks the last
      spot in each conference.</p>
      <details class="note"><summary>How these are worked out</summary>
        Every remaining game is played out ${P.sims ? P.sims.toLocaleString() : ""}
        times and the conference seeded under the real rules. The odds come
        from our forecasting rating, not the ranking above, so a team can rank
        low and still carry decent odds. Early in a season the error bars are
        wide: read 37 percent as somewhere near 37.</details>
      <div class="confs">${conf("AFC")}${conf("NFC")}</div>`;
  }
  else {
    h = `<div class="empty">The power ranking has not been built yet. It is
      refreshed by the daily run.</div>`;
  }
  el.innerHTML = h;
}


function trackerProps(T){
  const pb = T.prop_bets || [];
  if (!pb.length) return "";
  let h = "";
  {
    const decided = pb.filter(r => r.result !== "push");
    const wins = pb.filter(r => r.result === "win").length;
    h += `<h3 class="sec">Every prop graded so far</h3>
      <p class="lead tighter">${wins} of ${decided.length}. Rows marked
      <span class="tinj">injury</span> were decided by something that happened
      after kickoff and are not evidence about the model either way.</p>
      <table class="plain tracker"><thead><tr><th>Wk</th><th>Player</th>
        <th>Prop</th><th class="rt">Ours</th><th class="rt">Actual</th>
        <th>Result</th><th></th></tr></thead><tbody>` +
      pb.map(r => `<tr><td class="mono">${r.week}</td>
        <td>${esc(r.player)}</td>
        <td>${r.side === "OVER" ? "Over" : "Under"} ${r.line} ${statWords(r.stat)}</td>
        <td class="num mono">${r.projection}</td>
        <td class="num mono">${r.actual}</td>
        <td>${r.result === "win" ? '<span class="won">won</span>'
             : r.result === "loss" ? '<span class="lost">lost</span>'
             : '<span class="pushed">push</span>'}</td>
        <td>${r.decided_by_injury
              ? `<span class="tinj" title="${esc(r.decided_by_injury)}">injury</span>`
              : (r.published ? '<span class="tpub">named play</span>' : "")}</td>
        </tr>`).join("") + `</tbody></table>`;
  }
  return h;
}

function renderSeason(){
  const el = document.getElementById("tab-season");
  const T = DATA.tracker || {}, std = T.season_to_date || {};
  const su = std.straight_up || {}, bets = std.bets || {};
  const pr = T.props_running || {};
  const pn = Object.values(pr).reduce((a,b) => a + (b.n||0), 0);
  const pw = Object.values(pr).reduce((a,b) => a + (b.wins||0), 0);
  const pu = Object.values(pr).reduce((a,b) => a + (b.profit_units||0), 0);

  /* One representation of the season record, here and nowhere else. The
     "How we did" tab used to render the same figures again in a second table;
     these tiles absorb the two things that table had and these did not, the
     break-even a surface must clear and an honest note on sample size. */
  /* Each tile is three plain lines: the record, what share of them we got
     right, and the bar that share has to clear. The old wording ran them
     together as "16.7% of 12 / needs 52.4% to be worth running / 12 graded",
     which said the sample size twice, buried the comparison, and for the
     moneyline produced "needs the price taken to be worth running", which is
     not a sentence. */
  const tile = (lbl, big, sub, need, note, cls) =>
    `<div class="tile${big === "-" ? " idle" : ""}"><div class="tl">${lbl}</div>
      <div class="tb">${big}</div><div class="ts ${cls||""}">${sub}</div>
      ${need ? `<div class="tn">${need}</div>` : ""}
      ${note ? `<div class="tn">${note}</div>` : ""}</div>`;

  // "2-10" already says there were 12. Repeating it as "17% of 12" was part
  // of what made these unreadable.
  const pctOf = (w, n) => n ? `${(100*w/n).toFixed(0)}% right` : "-";
  // Say how thin the evidence is, without repeating the count already above.
  const sample = n => !n ? ""
    : n < 30  ? "Far too few to judge us on yet."
    : n < 100 ? "Still a thin sample."
    : "";

  /* Every tile says what the thing IS, in the same plain voice, because
     "Needs 52% to break even" told a reader the bar without ever telling them
     what was being bet on. The break-even rule is stated once under the grid
     instead of four times inside it. */
  const betTile = (k, lbl, what) => {
    const v = bets[k] || {};
    const wins = parseInt(String(v.record).split("-")[0] || 0);
    return tile(lbl, v.n ? v.record : "-",
      v.n ? pctOf(wins, v.n) : "nothing graded yet", what, sample(v.n));
  };

  let h = `<h2 class="sec">Season record</h2><div class="tiles">`
    + tile("Pickem", su.n ? su.record : "-",
        su.n ? pctOf(Math.round(su.n * su.hit_rate), su.n) : "nothing graded yet",
        "Just picking winners.", sample(su.n))
    + betTile("ats", "Winning margin",
        "Betting on how big the win is, not who wins.")
    + betTile("total", "Total points",
        "Betting on both teams' points added together.")
    + betTile("moneyline", "Betting on the winner",
        "Backing a winner, but only at odds worth the risk.")
    + tile("Player props", pn ? `${pw}-${pn-pw}` : "-",
        pn ? `${pctOf(pw, pn)}${pu ? `, ${pu > 0 ? "up" : "down"} `
             + `${Math.abs(pu).toFixed(1)} units` : ""}` : "nothing graded yet",
        "Betting on one player's own numbers, not the game.",
        sample(pn), pu > 0 ? "pos" : (pu < 0 ? "neg" : ""))
    + `</div>
    <p class="lead tighter">Bets have to clear about 52 percent, not 50, because
    the bookmaker keeps a cut either way.</p>
    ${(() => {
      /* Pickem and "betting on the winner" look like the same question and
         are not, which is confusing enough to be worth answering on the page.
         Counted live rather than written in, so it cannot go stale. */
      const picks = ((DATA.su || {}).picks) || [];
      const games = ((DATA.betting || {}).games) || [];
      if (!picks.length || !games.length) return "";
      const byId = {};
      for (const p of picks) byId[String(p.game_id)] = p.pick;
      let bet = 0, opposite = 0;
      for (const g of games){
        const ml = (g.bets || {}).moneyline;
        if (!ml) continue;
        const mine = byId[String(g.game_id)];
        if (!mine) continue;
        bet++;
        if (mine !== ml.pick) opposite++;
      }
      if (!bet) return "";
      return `<details class="note"><summary>Why Pickem and betting on the
        winner differ</summary>Pickem calls every game with nothing riding on
        it. The betting version only backs a winner when the odds are worth the
        risk, so it covers fewer games${bet && picks.length
          ? ` (${bet} of ${picks.length} this week)` : ""}${opposite
          ? `, and on ${opposite} of ${bet} it backed the team our Pickem call
             said would LOSE` : ""}. A long shot at a long enough price is worth
        backing even when we expect it to lose.</details>`;
    })()}`;

  if (DATA.power && (DATA.power.teams||[]).length){
    h += `<p class="lead">Team ratings, unit ranks, strength of schedule and
      every team's playoff chance now live on the
      <a href="#" class="tablink" data-go="power">Power index</a> tab.</p>`;
  }

  /* Every pick and prop graded, newest week first, so the record above can
     be taken apart into the games that made it. trackerPicks is the single
     implementation; this tab is its only home. It used to render here AND on
     "How we did", the same table twice. */
  h += trackerPicks(T);

  el.innerHTML = h;
}

function renderSU(){
  const el = document.getElementById("tab-su");
  const su = DATA.su;
  /* Which games have actually been played and how we did on them. Keyed by
     game_id rather than by position, because the two orderings differ: this
     tab sorts by confidence and the diagnostic is in schedule order. */
  const graded = {};
  for (const g of ((DATA.diagnostic || {}).head_to_head_games || [])){
    if (g && g.game_id != null) graded[String(g.game_id)] = g;
  }
  const mark = p => {
    const g = graded[String(p.game_id)];
    if (!g) return "";                       // not played yet, say nothing
    const won = !!g.we_picked_winner;
    const detail = `${won ? "Correct" : "Wrong"}: ${esc(g.actual_winner)} won`
      + (g.actual_margin != null ? ` by ${Math.abs(g.actual_margin)}` : "");
    return `<span class="gmark ${won ? "gwon" : "glost"}" title="${detail}"
      aria-label="${detail}">${won ? "&#10003;" : "&#10007;"}</span>`;
  };
  if (!su || !su.picks || !su.picks.length){
    el.innerHTML = '<div class="empty">No straight-up picks generated for this week yet.</div>';
    return;
  }
  /* What the model could and could not see, collapsed. It is worth being able
     to check and not worth eight lines at the top of every visit.

     Values are rendered rather than stringified. A plain esc() printed the
     declared adjustments object as "[object Object]", so the single most
     informative line here was the unreadable one. */
  let notice = "";
  const bt = su.backtest, dc = su.data_completeness;
  if (bt || dc){
    const fmtVal = v => {
      if (v === true)  return '<span class="yes">available</span>';
      if (v === false) return '<span class="no">missing</span>';
      if (v && typeof v === "object"){
        const parts = Object.entries(v).map(([k2,v2]) =>
          typeof v2 === "number" ? `${esc(k2)} ${v2>0?"+":""}${v2}`
                                 : `${esc(k2)} ${esc(v2)}`);
        return parts.length ? esc0(parts.join(", ")) : '<span class="no">none</span>';
      }
      return esc(String(v));
    };
    let items = "", have = 0, total = 0, extra = "";
    if (dc) for (const k in dc){
      const v = dc[k];
      if (typeof v === "boolean"){ total++; if (v) have++; }
      else if (v && typeof v === "object" && Object.keys(v).length)
        extra = `${Object.keys(v).length} declared adjustment`
              + (Object.keys(v).length === 1 ? "" : "s");
      items += `<li>${esc(k.replace(/_/g," "))}: ${fmtVal(v)}</li>`;
    }
    const gaps = total - have;
    const head = total
      ? (gaps ? `${gaps} of ${total} inputs missing` : `all ${total} inputs available`)
        + (extra ? `, ${extra}` : "")
      : "what our model could see";
    notice = `<details class="notice note"><summary>Read this first: ${esc0(head)}</summary>
      ${bt ? `<p>${esc(bt.summary)} ${esc(bt.implication || "")}</p>` : ""}
      <ul class="dc">${items}</ul></details>`;
  }
  const byGame = {};
  ((DATA.betting || {}).games || []).forEach(g => { byGame[g.game_id] = g; });
  const cards = su.picks.map((p, i) => {
    const m = p.model_inputs || {};
    const bg = byGame[p.game_id] || {};
    // Fall back to the betting page for the projection and the line. Picks
    // written before the engine was wired in carry neither, but the same
    // numbers are on the other file, keyed by the same game id.
    const margin = m.predicted_margin != null ? m.predicted_margin : bg.predicted_margin;
    const line = m.market_spread_line != null ? m.market_spread_line
               : ((bg.market || {}).spread_line);
    const chips = (p.factors_cited || []).map(factorChip).join("");
    let gap = m.model_market_gap;
    if (gap == null && margin != null && line != null) gap = +(margin - line).toFixed(1);
    // The oddsmakers' pick is just the sign of their line: positive means they
    // favor the home team. Showing it beside ours turns "do we disagree?" from
    // mental arithmetic into something you can see at a glance.
    const theirPick = line == null ? null
                    : (line > 0 ? p.home_team : (line < 0 ? p.away_team : "pick-em"));
    const sub = margin == null ? "" :
      `Our model has ${margin > 0 ? p.home_team : p.away_team} by
       ${Math.abs(margin).toFixed(1)}`
      + (line != null
          ? ` &nbsp;·&nbsp; the oddsmakers have
              ${line > 0 ? p.home_team : p.away_team} by ${Math.abs(line).toFixed(1)}`
          : "")
      + (gap != null && Math.abs(gap) >= 0.1
          ? ` &nbsp;·&nbsp; ${Math.abs(gap).toFixed(1)} points apart` : "");
    return `<div class="card">
      <div class="card-head" onclick="this.parentNode.querySelector('.body').classList.toggle('open')">
        <div class="rankno mono">${mark(p)}<span class="rn">${i+1}</span></div>
        <div><div class="matchup">${p.pick === p.away_team
            ? `<span class="picked">${esc(p.away_team)}</span>` : esc(p.away_team)}<span class="at">at</span>${p.pick === p.home_team
            ? `<span class="picked">${esc(p.home_team)}</span>` : esc(p.home_team)}</div>
          <div class="sub">${sub}</div></div>
        <div class="theirbox">
          <div class="picklabel">Oddsmakers say</div>
          <div class="pick theirs">${esc(theirPick || "n/a")}</div>
          ${theirPick && theirPick !== p.pick
            ? '<div class="disagree">we disagree</div>' : ""}
        </div>
        <div class="pickbox">
          <div class="picklabel">Our pick</div>
          <div class="pick">${esc(p.pick)}</div>
        </div>
        <div class="confbox">${meter(p.confidence)}</div>
      </div>
      <div class="chips">${chips}</div>
      <div class="body"><p>${esc(p.justification)}</p>${breakdownTable(m.factor_breakdown)}</div>
    </div>`;
  }).join("");
  el.innerHTML = notice
    + `<p class="lead">Who we expect to win each game, most confident first.
       Click any game for the reasoning.</p>
      <details class="note"><summary>Reading this page</summary>
        <b>Our model</b> is this system. <b>The oddsmakers</b> are the professional
        bookmakers' line. Where the two differ, we are disagreeing with them.
        A positive margin means the home team wins by that much, a negative one
        the visitor. A green tick or red cross marks games already played.</details>`
    + cards;
}

function impliedFromAmerican(p){
  if (p == null) return null;
  return p < 0 ? (-p)/((-p)+100) : 100/(p+100);
}

function betCell(kind, bet, g){
  const market = (g && g.market) || {};
  const titles = {ats:"Winning margin", total:"Total points scored",
                  moneyline:"Who wins outright"};
  if (!bet) return `<div class="betcell"><div class="k">${titles[kind]}</div>
    <div class="v"><span class="pill none">No play</span></div>
    <div class="why">Our model and the oddsmakers essentially agree on this one, so
    there is nothing worth betting.</div></div>`;
  let v = "", why = "";
  const winner = g && g.predicted_margin != null
    ? (g.predicted_margin > 0 ? g.home_team : g.away_team) : null;
  if (kind === "ats"){
    const by = Math.abs(bet.model_margin);
    v = `<span class="pill play">Take ${esc(bet.pick)} ${sign(bet.line)}</span>`;
    why = `Our model expects ${esc(winner || bet.pick)} to win this game by about
           ${by.toFixed(0)}. The oddsmakers set the line at ${Math.abs(bet.line).toFixed(1)},
           a gap of ${bet.edge_points}. Betting ${esc(bet.pick)} here is a bet that our
           model has the margin closer to right than they do.`;
  } else if (kind === "total"){
    v = `<span class="pill play">Take the ${esc(bet.pick.toLowerCase())} ${bet.line}</span>`;
    why = `Our model expects roughly ${Math.round(bet.model_total)} total points in this
           game. The oddsmakers set it at ${bet.line}. We think it lands
           ${bet.pick === "OVER" ? "higher" : "lower"} than they do, by ${bet.edge_points}.`;
  } else {
    const price = g && bet.pick === g.home_team ? market.home_moneyline : (market.away_moneyline);
    const pstr = price != null ? (price > 0 ? "+" + price : "" + price) : "";
    v = `<span class="pill play">${esc(bet.pick)} to win outright ${pstr}</span>`;
    if (winner && bet.pick !== winner){
      why = `<b>Expect ${esc(winner)} to win this game.</b> Our model agrees with the
             oddsmakers on that. Where we differ is the price: they are treating
             ${esc(bet.pick)} as a longer shot than our model thinks they are. So if you
             are placing a bet, ${esc(bet.pick)} at ${pstr} is the one that is generously
             priced. Understand what it is: an underdog bet that will usually lose. Small
             stake or skip it. It is not a prediction that ${esc(bet.pick)} wins.`;
    } else {
      why = `Our model makes ${esc(bet.pick)} a clearer winner than the oddsmakers do, so
             backing them to win outright at ${pstr} is priced in our favor.`;
    }
  }
  return `<div class="betcell"><div class="k">${titles[kind]}</div>
    <div class="v">${v}</div><div class="why">${why}</div></div>`;
}
