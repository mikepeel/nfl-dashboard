/* ---------- player props ----------
   The order here is deliberate and differs from every other tab: the health
   warning comes BEFORE the plays. On the other tabs a backtest exists and the
   caveats are footnotes. This model has never been graded, and it currently
   sits below the oddsmakers on almost every prop, so the reader needs both
   facts before the numbers rather than after them. */
const STAT_WORDS = {
  receptions:"catches", receiving_yards:"receiving yards",
  rushing_yards:"rushing yards", carries:"carries", targets:"targets",
  pass_attempts:"pass attempts", passing_yards:"passing yards",
  pass_completions:"completions", pass_tds:"passing touchdowns"
};
function statWords(s){ return STAT_WORDS[s] || String(s).replace(/_/g," "); }

/* The prop itself, named the way it is actually posted. This is the headline
   on every row: the reader is looking for a specific bet, and burying its
   name behind a paraphrase makes the board hard to scan against a
   sportsbook. */
function propName(p){
  return `${p.side === "OVER" ? "Over" : "Under"} ${p.line} ${statWords(p.stat)}`;
}

/* And underneath it, what actually has to happen, in whole units. "Over 3.5
   catches" asks the reader to already know why a half exists and to do the
   rounding themselves. Both are shown: the prop is the label, this is the
   meaning. */
function needLine(p){
  const w = statWords(p.stat);
  if (p.side === "OVER"){
    const n = Number.isInteger(p.line) ? p.line + 1 : Math.ceil(p.line);
    return `<b>${n} or more</b> ${w}`;
  }
  const n = Number.isInteger(p.line) ? p.line : Math.floor(p.line);
  return `<b>${n} or fewer</b> ${w}`;
}

/* Every number on this page belongs to somebody, and the column it sits in
   says who. Three opinions on the same question -- will this prop hit -- put
   on one scale so they can be read against each other:

     Our model    this system's projection, and the chance it implies
     Oddsmakers   the sportsbook's price with its margin removed
     Kalshi       a prediction market, whose price is already a probability

   Expressing all three as the chance THIS PROP HITS matters. An over row and
   an under row would otherwise be quoted on opposite conventions and could
   not be compared down the column. */
function pct(x){ return x == null ? "&ndash;" : Math.round(x * 100) + "%"; }

/* Name the actual sportsbook rather than saying "oddsmakers".
   The game tabs consensus nine books and have earned that word. This page
   pulls one book by default, and calling one book "the oddsmakers" claims a
   market agreement that was never taken. Driven from the data so it stays
   true if more books are ever pulled. */
const BOOK_NAMES = {
  draftkings: "DraftKings", fanduel: "FanDuel", betmgm: "BetMGM",
  caesars: "Caesars", pinnacle: "Pinnacle", betrivers: "BetRivers",
  williamhill_us: "Caesars", bovada: "Bovada", betonlineag: "BetOnline"
};

/* The probability column belongs to whoever SET the number, not to whoever
   is taking the bet. Those are different books and it matters: DraftKings,
   BetMGM and MGM all buy prop origination from the same source, so quoting
   DraftKings was quoting a follower. Pinnacle is a market maker -- it prices
   independently, takes the largest bets, and other books wait to see its
   number before posting -- and it carries the lowest hold of any book here
   (5.35% against DraftKings' 5.78%), so its de-vigged price is the cleanest
   probability available. */
function anchorLabel(rows){
  const withAnchor = (rows || []).find(r => r.anchor_book);
  const key = withAnchor ? withAnchor.anchor_book : null;
  return key ? (BOOK_NAMES[key] || key) : "Oddsmakers";
}

/* Where the market maker's line differs from the one on offer, that gap is
   the most actionable thing on the page and it exists independently of our
   model. Backing an under at 65.5 while Pinnacle deals 60.5 means taking
   five yards better than the sharpest number in the market. */
function sharpGapCell(c){
  if (c.anchor_line == null)
    return `<span class="nomkt" title="Pinnacle posts no number on this player and stat, so there is no market maker to measure against.">no line</span>`;
  const gap = c.line - c.anchor_line;
  if (Math.abs(gap) < 1e-9)
    return `<span class="gap-same" title="Pinnacle deals the same number, so the line on offer is neither better nor worse than the market maker's.">same</span>`;
  const good = (gap < 0 && c.side === "OVER") || (gap > 0 && c.side === "UNDER");
  const better = Math.abs(gap).toFixed(1);
  const tip = good
    ? `Pinnacle deals ${c.anchor_line}. Taking this at ${c.line} is ${better} better than the market maker's own number, before our model says anything.`
    : `Pinnacle deals ${c.anchor_line}, which is ${better} better than the ${c.line} on offer. The market maker's number argues against this bet.`;
  return `<span class="gap-${good ? "good" : "bad"}" title="${esc(tip)}">`
       + `${good ? "+" : "-"}${better}</span>`;
}

/* A fixture is always written away @ home, never "team vs opponent".
   "vs" reads from whichever player happens to be on the row, so the same game
   appears as "MIA vs LV" on one line and "LV vs MIA" on the next, which makes
   a board impossible to scan and does not match how a schedule is written
   anywhere else.

   Away @ home is fixed for the game, so it reads the same on every row. The
   player's own side is emboldened inside it, which keeps the one thing "vs"
   was doing without letting it reorder the fixture. */
function matchupCell(c){
  const away = c.away_team, home = c.home_team;
  if (!away || !home) return esc(c.team) + ' <span class="vs">@</span> ' + esc(c.opponent);
  const mark = t => t === c.team ? `<b>${esc(t)}</b>` : esc(t);
  return `${mark(away)} <span class="vs">@</span> ${mark(home)}`;
}

/* Kalshi is always stored as the probability of the OVER, so an under row
   needs the complement to be talking about the same event as its neighbours. */
function exchangeProb(c){
  const s = c.second_opinion;
  if (!s) return null;
  return c.side === "OVER" ? s.exchange_prob_over : 1 - s.exchange_prob_over;
}

/* The Kalshi cell is colored by how far it sits from our own number, and the
   tooltip says what to do about it in a sentence.

   The earlier version printed a verdict string -- "both against us" -- which
   was the wrong thing to show. It made the reader reconstruct what the phrase
   meant and then work out the consequence for themselves, and it hid the
   number that would have told them directly. Three probabilities side by side
   need no verdict: 62 against 50 and 48 says everything the sentence did, and
   says which of the three is the odd one out. */
/* Confidence, banded so the eye can sort it without reading every number.
   The tooltip lists what was deducted and why, because a confidence figure
   with no visible derivation is just an assertion. */
function confidenceCell(c){
  if (c.confidence == null) return "&ndash;";
  const d = c.confidence_detail || {};
  const reasons = (d.reasons || [])
    .map(r => `${Math.round(r.keeps * 100)}%: ${r.why}`).join(" | ");
  const tip = `Our model alone says ${pct(d.raw_model_prob)}. We keep `
    + `${Math.round((d.trust || 1) * 100)}% of the distance between that and `
    + `the oddsmakers' ${pct(d.anchor_market_prob)}, because: ${reasons}`;
  let band = "mid";
  if (c.confidence >= 0.68) band = "hi";
  else if (c.confidence < 0.58) band = "lo";
  return `<span class="conf-${band}" title="${esc(tip)}">${pct(c.confidence)}</span>`;
}

function exchangeCell(c){
  const p = exchangeProb(c);
  if (p == null)
    return `<span class="nomkt" title="No Kalshi market at this exact number with money behind it, so there is nothing to compare against here.">no market</span>`;
  const gap = c.model_prob - p;
  let cls = "", tip;
  if (Math.abs(gap) < 0.04){
    cls = " agree";
    tip = "Kalshi lands close to our model, so two independent opinions agree. "
        + "The rarest and most encouraging shape on this page.";
  } else if (gap > 0){
    cls = " against";
    tip = "Kalshi rates this lower than our model does. With the oddsmakers "
        + "also below us, our number is the outlier, and the play is weaker "
        + "than our own figure suggests.";
  } else {
    tip = "Kalshi rates this higher than our model does.";
  }
  return `<span class="exch${cls}" title="${esc(tip)}">${pct(p)}</span>`;
}
function stakeAdvice(score){
  if (score >= 7) return "Normal stake.";
  if (score >= 5) return "Small stake.";
  if (score >= 3) return "Small stake, or skip it.";
  return "Skip it. Listed for the record, not as a recommendation.";
}

function renderProps(){
  const el = document.getElementById("tab-props");
  const P = DATA.props, C = DATA.props_candidates;
  if (!C){
    el.innerHTML = '<div class="empty">No player props page for this week yet.</div>';
    return;
  }
  const picks = (P && P.picks) || [];
  const split = C.side_split || {};
  const over = split.OVER || 0, under = split.UNDER || 0;

  /* The published plays, as rows rather than as cards.

     This was three expandable cards carrying a paragraph of argument, a
     caution, and three labeled sub-cells each. All of that is real, and
     almost none of it is what the section is for. A reader here wants the
     bet, our chance of being right, and what the two other opinions say, on
     one line they can act on. The argument stays one click away rather than
     occupying the top of the page. */
  let named = "";
  if (picks.length){
    named = `<h2 class="sec">${picks.length === 1 ? "The one play we are backing"
              : `The ${picks.length} plays we are backing`}</h2>
      <table class="props top"><thead>
        <tr class="grouphead"><th colspan="3"></th>
          <th colspan="3">Chance this prop hits, by whose opinion</th>
          <th colspan="2"></th></tr>
        <tr><th>Take this</th><th>Player</th><th>Matchup</th>
          <th class="rt">Our model</th>
          <th class="rt">${esc(anchorLabel(picks))}</th>
          <th class="rt">Kalshi</th><th class="rt">vs sharp line</th>
          <th class="rt">Confidence</th></tr>
      </thead><tbody>` +
      picks.slice().sort((a, b) => b.confidence - a.confidence).map((p, i) => {
        const price = (p.price > 0 ? "+" : "") + p.price;
        return `<tr class="toprow" onclick="document.getElementById('why-${i}').classList.toggle('open')">
          <td class="prop"><span class="propline">${esc(propName(p))}</span>
            <span class="propctx">${needLine(p)}</span></td>
          <td class="player">${esc(p.player)}<span class="pos">${esc(p.position)}</span></td>
          <td class="matchup-cell">${matchupCell(p)}</td>
          <td class="num two"><span class="big">${pct(p.model_prob)}</span></td>
          <td class="num two"><span class="big">${pct(p.market_prob)}</span>
            <span class="small">at ${price}</span></td>
          <td class="num two">${exchangeCell(p)}</td>
          <td class="num">${sharpGapCell(p)}</td>
          <td class="num two">${confidenceCell(p)}
            <span class="small">${stakeAdvice(p.score)}</span></td></tr>
        <tr class="whyrow"><td colspan="8" class="why-cell">
          <div class="why-body" id="why-${i}">
            <p>${esc(p.justification || "")}</p>
            <p class="caution"><b>Watch out:</b> ${esc(p.caution || "")}</p>
          </div></td></tr>`;
      }).join("") +
      `</tbody></table>
       <p class="lead tighter">Click a row for the reasoning behind it.</p>`;
  } else {
    named = `<div class="empty">No play cleared the bar this week. That is a
      normal outcome, not a gap to fill.</div>`;
  }

  /* ---- the full board, game by game ----
     Overs and unders are split into their own tables per game, which is the
     shape a reader scanning one matchup actually wants. Rows are ordered by
     board score, which is derived from how unusual a prop is AFTER the
     model's slate-wide lean is removed. Ordering by raw disagreement would
     put the same handful of stale-role players on top of every game. */
  const ROWS = 6;
  /* Which rows made the top-plays list, so they can be marked in context.
     Everything else on the board is ordered by confidence alone. */
  const key = x => x.player + "|" + x.stat + "|" + x.side;
  const namedMap = new Map(picks.map(p => [key(p), p]));
  const byGame = new Map();
  (C.candidates || []).forEach(c => {
    if (!byGame.has(c.game_id)) byGame.set(c.game_id, []);
    byGame.get(c.game_id).push(c);
  });
  const games = [...byGame.entries()].sort((a, b) =>
    String(a[1][0].kickoff || "").localeCompare(String(b[1][0].kickoff || "")));

  function propTable(rows, side, gid){
    const label = side === "OVER" ? "Top over plays" : "Top under plays";
    if (!rows.length){
      return `<div class="propnone">No ${side.toLowerCase()} plays cleared the
        thresholds in this game.</div>`;
    }
    const cls = side === "OVER" ? "over" : "under";
    /* Column headers name the owner of every number. The three probability
       columns are the same question asked of three different opinions, which
       is only legible if the reader is told whose is whose. */
    const head = `<caption>${label}</caption><thead>
      <tr class="grouphead">
        <th colspan="3"></th>
        <th colspan="3">Chance this prop hits, by whose opinion</th>
        <th colspan="2"></th></tr>
      <tr>
        <th>Prop</th><th>Player</th><th>Matchup</th>
        <th class="rt">Our model</th><th class="rt">${esc(anchorLabel(rows))}</th>
        <th class="rt">Kalshi</th>
        <th class="rt">vs sharp line</th>
        <th class="rt">Confidence</th></tr></thead>`;
    const tr = (c, i) => {
      const k = key(c);
      const named = namedMap.get(k);
      const hid = i >= ROWS ? ` class="extra-${cls}-${gid}" style="display:none"` : "";
      const cls2 = hid ? hid : (named ? ' class="named-play"' : "");
      const price = (c.price > 0 ? "+" : "") + c.price;
      const star = named ? '<span class="tickmark">top play</span>' : "";
      return `<tr${cls2}>
        <td class="prop"><span class="propline">${esc(propName(c))}</span>
          <span class="propctx">${needLine(c)}</span></td>
        <td class="player">${esc(c.player)}${star}<span class="pos">${esc(c.position||"")}</span></td>
        <td class="matchup-cell">${matchupCell(c)}</td>
        <td class="num two"><span class="big">${pct(c.model_prob)}</span>
          <span class="small">projects ${c.projection}</span></td>
        <td class="num two"><span class="big">${pct(c.market_prob)}</span>
          <span class="small">at ${price}</span></td>
        <td class="num two">${exchangeCell(c)}</td>
        <td class="num">${sharpGapCell(c)}</td>
        <td class="num two">${confidenceCell(c)}</td></tr>`;
    };
    let html = `<table class="props ${cls}">${head}<tbody>` +
      rows.map(tr).join("") + `</tbody></table>`;
    if (rows.length > ROWS){
      html += `<div class="propmore">${rows.length - ROWS} more
        <button onclick="document.querySelectorAll('.extra-${cls}-${gid}')
          .forEach(r => r.style.display = r.style.display === 'none' ? '' : 'none');
          this.textContent = this.textContent === 'show' ? 'hide' : 'show';">show</button></div>`;
    }
    return html;
  }

  const board = games.map(([gid, rows]) => {
    const first = rows[0];
    /* Away at home, in that order, which is how a schedule is written and how
       every other tab on this report reads. The candidates carry both sides
       explicitly rather than the visiting side being inferred, so a game is
       never rendered as two teams joined by "and". */
    const g = (C.games || {})[gid] || {};
    const away = g.away_team || first.away_team;
    const home = g.home_team || first.home_team;
    const title = (away && home)
      ? `${esc(away)}<span class="at">@</span>${esc(home)}`
      : `${esc(first.team)}<span class="at">@</span>${esc(first.opponent)}`;
    const kickAt = g.kickoff || first.kickoff;
    const kick = kickAt
      ? `<span class="kick">${localTime(kickAt, false)}</span>`
      : "";
    /* Ranked by confidence, which is the only ordering on this page that
       answers a question a reader has. */
    const by = s => rows.filter(r => r.side === s)
                        .sort((a, b) => b.confidence - a.confidence);
    return `<div class="propgame"><h3>${title}${kick}</h3>
      ${propTable(by("OVER"), "OVER", gid)}
      ${propTable(by("UNDER"), "UNDER", gid)}</div>`;
  }).join("");

  const boardIntro = `<h2 class="sec">Every game on the board</h2>
    <table class="plain legend"><tbody>
      <tr><td><b>Our model</b></td><td>The chance this system alone gives the
        prop, and the stat line behind it.</td></tr>
      <tr><td><b>Pinnacle</b></td><td>The market maker's chance, its margin
        taken out. Pinnacle sets its own numbers, takes the largest bets, and
        other books wait to see it before posting; it also runs the lowest
        margin here, so its price is the cleanest probability available. This
        is deliberately NOT the book the bet is placed at: DraftKings, BetMGM
        and MGM all buy their prop numbers from the same source, so quoting one
        of them would be quoting a follower.</td></tr>
      <tr><td><b>vs sharp line</b></td><td><b>The edge that exists before our
        model says anything.</b> How much better the number on offer is than the
        one Pinnacle deals. Backing an under at 65.5 while Pinnacle deals 60.5
        is five yards to the good. Green is in your favor, red is against, and
        hovering gives both numbers.</td></tr>
      <tr><td><b>Kalshi</b></td><td>A prediction market where people trade real
        money, so its price is already a chance. An independent third
        opinion.</td></tr>
      <tr><td><b>Confidence</b></td><td><b>The number to rank on.</b> Our
        all-things-considered chance the prop hits: our own figure pulled toward
        the market by however much we trust ourselves on that particular prop.
        A traded player with four games of history on a noisy stat keeps little
        of his edge; a settled veteran an exchange agrees with keeps most of it.
        Hover any figure to see exactly what was deducted and why.</td></tr>
    </tbody></table>`;

  const body = named + boardIntro + board;

  /* The passes matter as much as the plays on this page, so they get real
     estate rather than a footnote. */
  let rejected = "";
  const rj = (P && P.considered_and_rejected) || [];
  if (rj.length){
    rejected = `<h2 class="sec">Strong-looking numbers we are not backing</h2>
      <p class="lead">Big gaps, listed because a big gap is a warning rather
      than an edge. When we are far from the oddsmakers, they are usually
      right.</p>
      <table class="plain"><thead><tr><th>Player</th><th>The number</th>
        <th>Ours</th><th>Why we are passing</th></tr></thead><tbody>` +
      rj.map(r => `<tr><td>${esc(r.player)}</td>
        <td>${esc(String(r.side).toLowerCase())} ${nn(r.line)} ${statWords(r.stat)}</td>
        <td class="mono">${nn(r.projection)}</td>
        <td>${esc(r.why_not)}</td></tr>`).join("") +
      `</tbody></table>`;
  }

  /* What was deliberately left unpriced, so silence is never mistaken for
     "no edge found". */
  let skipped = "";
  const dc = (C.depth_chart_conflicts || []), lc = (C.not_priced_model_says_unreliable || []);
  if (dc.length || lc.length){
    const dcNames = [...new Set(dc.map(x => x.player))];
    skipped = `<h2 class="sec">Left off the board on purpose</h2><ul class="lead">`;
    if (dcNames.length){
      skipped += `<li><b>${dcNames.length} players the oddsmakers quote but our
        depth chart has outside the rotation</b> (${esc(dcNames.slice(0,6).join(", "))}${
        dcNames.length > 6 ? ", and others" : ""}). Projecting them at zero would
        have manufactured enormous fake edges on the under, so they are not
        priced at all. A bookmaker quoting a player is evidence he plays.</li>`;
    }
    if (lc.length){
      skipped += `<li><b>Quarterback rushing lines are not priced.</b>
        Kneel-downs count as carries with negative yards, so the underlying
        statistic describes clock management rather than running.</li>`;
    }
    skipped += `</ul>`;
  }

  el.innerHTML = body + rejected + skipped
    + trackerProps(DATA.tracker || {});
}

function recordTable(map, title, note){
  const keys = Object.keys(map || {}).filter(k => map[k]);
  if (!keys.length) return "";
  let h = `<h3 class="sec">${esc(title)}</h3>`;
  if (note) h += `<p class="lead">${note}</p>`;
  h += `<table class="plain"><thead><tr><th>${esc(title)}</th><th>Record</th>
    <th>Hit rate</th><th>Needed</th><th>Difference</th><th>Units</th>
    </tr></thead><tbody>`;
  for (const k of keys){
    const v = map[k];
    const diff = v.above_break_even;
    const col = diff > 0 ? "var(--pos)" : (diff < 0 ? "var(--neg)" : "var(--dim)");
    h += `<tr><td>${esc(LAB.factors[k] ? LAB.factors[k].label : k)}</td>
      <td class="mono">${v.wins}/${v.n}</td>
      <td class="mono">${(v.hit_rate*100).toFixed(1)}%</td>
      <td class="mono">${(v.break_even_needed*100).toFixed(1)}%</td>
      <td class="mono" style="color:${col}">${diff > 0 ? "+" : ""}${(diff*100).toFixed(1)}%</td>
      <td class="mono">${v.profit_units > 0 ? "+" : ""}${v.profit_units}</td></tr>`;
  }
  return h + "</tbody></table>";
}

/* What the props page will be judged on, shown BEFORE any of it has been
   graded. A tab that says only "no results yet" teaches the reader nothing
   and hides the fact that the questions are already fixed and cannot be
   moved after the fact to fit whatever happened. */
function propsPlan(){
  const P = DATA.props, C = DATA.props_candidates;
  if (!P && !C) return "";
  const under = (C && C.side_split && C.side_split.UNDER) || 0;
  const over = (C && C.side_split && C.side_split.OVER) || 0;
  return `<h2 class="sec">Player props: what we are about to find out</h2>
    <p class="lead">The props page has not been graded yet, because it is new
    this week. These are the questions it will be judged on, written down
    before the results arrive so they cannot be adjusted afterwards to suit
    whatever happened.</p>
    <table class="plain"><thead><tr><th>The question</th><th>Why it decides something</th>
      <th>What answers it</th></tr></thead><tbody>
    <tr><td><b>Do the unders pay?</b></td>
      <td>Our model produced ${under} unders against ${over} overs. Either the
        oddsmakers shade their lines toward the over, or our projections are
        simply low. These are opposite conclusions and only one is true.</td>
      <td>The over and under hit rates, each against the break-even implied by
        the price actually paid. Needs roughly 60 graded props.</td></tr>
    <tr><td><b>Is the lean-adjusted ranking earning its place?</b></td>
      <td>The whole board is ordered on the assumption that a prop running
        against our own slate-wide lean is worth more than one running with it.
        If that is wrong, the ordering is actively harmful.</td>
      <td>Hit rate split by whether a play ran against our lean or with it.
        Needs roughly 50 graded props.</td></tr>
    <tr><td><b>Which reasons actually predict anything?</b></td>
      <td>Every published play cites its factors. Some of them are probably
        decoration. Knowing which ones carry the result is what lets the model
        be tightened rather than merely re-tuned.</td>
      <td>Hit rate bucketed by each cited factor, the same attribution the
        straight-up page runs on its margin factors.</td></tr>
    <tr><td><b>Were the projections any good, separately from the bets?</b></td>
      <td>A prop can win on a badly wrong projection and lose on a good one.
        Conflating the two is how a model gets tuned in the wrong direction.</td>
      <td>Mean signed error per stat. A level error points at the share model;
        scatter points at the dispersion constants.</td></tr>
    </tbody></table>`;
}


/* ---------- provenance ----------
   What produced these numbers and how current they are, stated where it
   cannot be missed rather than left to be inferred.

   This is not decoration. A pick on this page once changed from Kansas City
   to Denver because a fallback run replaced the reasoned picks, and nothing
   on the page said so: the warning existed in picks.json and in the markdown
   writeup, and this file rendered neither. A reader had no way to tell a
   fallback pick from a reasoned one, or fresh data from stale. */
/* Times are rendered in the reader's own timezone, not UTC.
   Nobody reads UTC, and this page is opened on a phone, a tablet and a
   desktop that all know what time it is locally. Doing it in the browser
   rather than baking a timezone in at build time means it is right for
   whoever opens it, and it follows daylight saving without being told. */
function localTime(iso, withZone){
  if (!iso) return "";
  let s = String(iso);
  // A bare timestamp with no offset is UTC, which is what this repo writes.
  if (!/[Zz]|[+-]\d\d:?\d\d$/.test(s)) s += "Z";
  const d = new Date(s);
  if (isNaN(d)) return esc(String(iso).slice(0,16).replace("T"," "));
  const date = d.toLocaleDateString(undefined,
    {weekday:"short", month:"short", day:"numeric"});
  const time = d.toLocaleTimeString(undefined,
    {hour:"numeric", minute:"2-digit"});
  if (!withZone) return `${date}, ${time}`;
  let zone = "";
  try {
    zone = new Intl.DateTimeFormat(undefined, {timeZoneName:"short"})
      .formatToParts(d).find(p => p.type === "timeZoneName").value;
  } catch(e){ zone = ""; }
  return `${date}, ${time}${zone ? " " + zone : ""}`;
}

function renderProvenance(){
  const P = DATA.provenance;
  if (!P) return;
  const el = document.getElementById("provenance");
  if (!el) return;

  const bits = [];
  bits.push(`<span class="pv-k">Picks from</span> <b>${esc(P.picks_source)}</b>`);
  if (P.picks_generated_at)
    bits.push(`<span class="pv-k">generated</span> <b>${localTime(P.picks_generated_at, true)}</b>`
      + (P.picks_age_hours != null ? ` <span class="pv-k">(${P.picks_age_hours}h ago)</span>` : ""));
  bits.push(`<span class="pv-k">results through</span> <b>${P.games_final} of ${P.games_in_slate} games final</b>`);
  bits.push(`<span class="pv-k">checked</span> <b>${localTime(P.checked_at, true)}</b>`);

  let html = `<div class="pv-line">${bits.join('<span class="pv-sep">&middot;</span>')}</div>`;
  for (const w of (P.warnings || [])){
    html += `<div class="pv-warn ${w.level}"><b>${esc(w.headline)}</b>
      <span>${esc(w.detail)}</span></div>`;
  }
  el.innerHTML = html;
}

/* ---------- season tracker ----------
   The running record, above everything else on this tab.

   The per-week diagnostics below are rewritten every time a week is
   regenerated. This is the part that accumulates, and it is the only honest
   answer to "is this thing working": one week is noise on every surface here,
   so the sample size sits beside every rate to stop a good Thursday being
   mistaken for a good model. */
/* Split in two, because one function was putting 261 graded props on the
   Season tab. Game results belong with the season record; prop results belong
   on the Player props tab with the rest of the props. */
function trackerPicks(T){
  const su = T.straight_up_picks || [];
  if (!su.length) return "";
  let h = "";
  if (su.length){
    h += `<h3 class="sec">Every game pick graded so far</h3>
      <table class="plain tracker"><thead><tr><th>Wk</th><th>Game</th>
        <th>Our pick</th><th class="rt">Confidence</th><th class="rt">Our margin</th>
        <th class="rt">Actual</th><th>Result</th></tr></thead><tbody>` +
      su.map(r => `<tr><td class="mono">${r.week}</td>
        <td>${esc(r.away_team || "?")} <span class="vs">@</span> ${esc(r.home_team || "?")}</td>
        <td><b>${esc(r.pick)}</b></td>
        <td class="num mono">${r.confidence}/10</td>
        <td class="num mono">${sign(r.predicted_margin)}</td>
        <td class="num mono">${sign(r.actual_margin)}</td>
        <td>${r.correct ? '<span class="won">won</span>'
                        : '<span class="lost">lost</span>'}</td></tr>`).join("")
      + `</tbody></table>`;
  }
  return h;
}

function renderProps_diag(){
  const d = DATA.props_diagnostic;
  if (!d) return propsPlan();
  const o = d.overall;
  const wk = d.week != null ? `Week ${d.week}` : "This week";
  let h = `<h2 class="sec">${wk}: the player props</h2>
    <p class="lead">Graded on the whole board, not just the named plays, so
    there is enough to measure. The sections below all break down that same
    board.</p>`;
  if (o){
    const diff = o.above_break_even;
    h += `<p class="lead">Went <b>${o.wins} of ${o.n}</b>
      (${(o.hit_rate*100).toFixed(1)}%) against ${(o.break_even_needed*100).toFixed(1)}%
      needed at the prices actually paid, for
      <b style="color:${diff>0?"var(--pos)":"var(--neg)"}">${o.profit_units>0?"+":""}${o.profit_units}
      units</b>. ${o.pushes ? o.pushes + " pushed and returned the stake." : ""}</p>`;
  }
  h += recordTable(d.by_side, "Split by over against under",
        "The number the whole page hangs on. If unders are not clearing their break-even, our projections are low and the model is the thing to fix, not the thresholds.");
  h += recordTable(d.by_stat, "Split by which stat");
  const w = d.where_the_guidance_hit || {};
  h += recordTable(w.by_factor, "Split by the reason we gave",
        "Every published play cites the factors that drove it. This is where a reason earns its place or is shown to be decoration.");
  h += recordTable(w.by_our_own_lean, "Split by whether it ran against our own lean",
        "The board is ordered on the assumption the first row should beat the second. If it does not, that ordering is costing us.");
  h += recordTable(w.by_published_score, "Split by the score we published",
        "Does a 5 actually beat a 3? If the scores do not separate, they are noise dressed as judgement.");

  const acc = d.projection_accuracy || {};
  if (Object.keys(acc).length){
    h += `<h3 class="sec">Were the projections themselves any good?</h3>
      <p class="lead">Separate from whether the bets won. A prop can win on a badly wrong number.</p>
      <p class="lead">A different question from whether the bets won, and the one
      that says whether to fix the model or the thresholds.</p>
      <table class="plain"><thead><tr><th>Stat</th><th>Average miss</th>
        <th>Signed</th><th>Reading</th></tr></thead><tbody>`;
    for (const k in acc){ const v = acc[k];
      h += `<tr><td>${esc(k.replace(/_/g," "))}</td>
        <td class="mono">${v.mean_absolute_error}</td>
        <td class="mono">${v.mean_signed_error > 0 ? "+" : ""}${v.mean_signed_error}</td>
        <td>${esc(v.reading)}</td></tr>`; }
    h += "</tbody></table>";
  }

  const sig = d.signals_for_the_retune || [];
  if (sig.length){
    h += `<h3 class="sec">What the props results suggest changing</h3>
      <p class="lead">Findings with their evidence, not automatic changes.
      Nothing here edits a threshold on its own: same rule as the weights file,
      propose and show the reasoning first.</p>`;
    for (const s of sig){
      h += `<div class="notice" style="${s.actionable_yet ? "" : "opacity:.75"}">
        <b>${esc(s.finding)}</b> ${esc(s.detail)}
        ${s.caveat ? `<ul><li>${esc(s.caveat)}</li></ul>` : ""}</div>`;
    }
  }
  return h;
}

function renderAssumptions(){
  /* What we are still asserting that the data has not yet confirmed. The
     rule is that human context fills a gap only until the data can show the
     effect itself, so anything still here is a claim carrying a deadline. */
  const A = DATA.assumptions;
  if (!A) return "";
  const rev = A.adjustments_reviewed || [];
  const untested = (A.constants_register || []).filter(c => c.how_set === "DECLARED");
  if (!rev.length && !untested.length) return "";

  let h = `<h2 class="sec">Assumptions we are still carrying</h2>
    <p class="lead">Not week-specific. Numbers set by judgement rather than
    measurement, rechecked every week and removed once the data can show the
    effect itself.</p>`;

  for (const r of rev){
    const act = String(r.recommended_action||"");
    const cls = act.startsWith("REMOVE") ? "neg" : act.startsWith("TAPER") ? "warn" : "pos";
    h += `<div class="ctxbox"><div class="ctxbox-h">${esc(r.assumption)}</div>
      <p><b>${esc(r.thresholds_met)}</b> of its own written thresholds met after
      ${r.games_played} game${r.games_played===1?"":"s"}.
      Our model currently weights this season at
      ${Math.round(100*(r.current_season_weight_in_ratings||0))}%, so that much
      of any real effect is already in the ratings.</p>
      <table class="plain"><thead><tr><th>Test</th><th class="rt">Now</th>
        <th class="rt">Needs</th><th></th></tr></thead><tbody>`
      + (r.tests||[]).map(t => `<tr><td>${esc(t.metric)}</td>
          <td class="num mono">${esc(String(t.measured))}</td>
          <td class="num mono na">${esc(String(t.threshold))}</td>
          <td>${t.met ? '<span class="won">met</span>'
                      : '<span class="na">not yet</span>'}</td></tr>`).join("")
      + `</tbody></table>`;
    if (r.component_attribution){
      h += `<p class="na" style="margin-top:8px">${esc(r.component_attribution)}</p>`;
    }
    h += `<p style="margin-top:8px"><b class="${cls}">${esc(act)}</b>
      ${esc(r.verdict)}. ${esc(r.sample_note||"")}</p></div>`;
  }

  if (untested.length){
    h += `<div class="ctxbox"><div class="ctxbox-h">Set by judgement, never tested</div>
      <p>These are honest guesses that have not been measured yet. Listed so
      they cannot quietly become facts.</p>
      <table class="plain"><thead><tr><th>Number</th><th class="rt">Value</th>
        <th>Where</th><th>What would settle it</th></tr></thead><tbody>`
      + untested.map(c => `<tr><td>${esc(c.name)}</td>
          <td class="num mono">${esc(String(c.value))}</td>
          <td class="na">${esc(c.where)}</td>
          <td class="na">${esc(c.test)}</td></tr>`).join("")
      + `</tbody></table></div>`;
  }
  return h;
}

function renderDiag(){
  const el = document.getElementById("tab-diag");
  const tracker = renderAssumptions();
  const d = DATA.diagnostic;
  if (!d){
    el.innerHTML = `<div class="empty">This week has not been graded yet.
      Results appear here once the games are final.</div>`
      + renderProps_diag() + tracker;
    return;
  }
  /* Ordered results first, assumptions last, and every heading names which
     of the four surfaces it is about. It used to open with "What we are still
     assuming" and then a heading reading only "This week", so a reader met
     the caveats before the results and could not tell which page any section
     referred to. */
  const su = d.straight_up || d;
  const wk = d.week != null ? `Week ${d.week}` : "This week";

  let html = `<p class="lead">How each page did, and what it says to change.
    ${wk} only, except where a section says otherwise.</p>`;

  html += `<h2 class="sec">${wk}: the Pickem picks</h2>
    <p class="lead">Record <b>${esc(su.record)}</b>, ${esc(su.accuracy)} of games
    called right.</p>`;

  if (d.high_confidence_misses && d.high_confidence_misses.length){
    html += `<h3 class="sec">Confident calls that missed</h3>
      <p class="lead">The ones worth explaining, because we said we were sure.</p>
      <ul>` + d.high_confidence_misses.map(m =>
        `<li>${esc(m.pick)} at ${m.confidence}/10, but
         ${esc(m.actual_winner)} won.</li>`).join("") + "</ul>";
  }

  if (d.bets){
    html += `<h2 class="sec">${wk}: the bets</h2>
      <p class="lead">Money on it, so each row has to clear its own break-even,
      not 50 percent.</p>
      <table class="plain"><thead><tr>
      <th>Bet</th><th>Record</th><th class="rt">Hit rate</th>
      <th class="rt">Break-even</th><th>Verdict</th>
      </tr></thead><tbody>`;
    const BETNAME = {ats: "Winning margin", total: "Total points",
                     moneyline: "Who wins outright"};
    for (const k in d.bets){ const v = d.bets[k];
      html += `<tr><td>${esc(BETNAME[k] || k)}</td><td class="mono">${esc(v.record)}</td>
        <td class="num mono">${esc(v.hit_rate)}</td>
        <td class="num mono na">${esc(v.break_even)}</td>
        <td>${esc(v.verdict)}</td></tr>`; }
    html += "</tbody></table>";
  }

  el.innerHTML = html + renderProps_diag() + tracker;
}

function renderGloss(){
  const g = (LAB.glossary || []);
  document.getElementById("tab-gloss").innerHTML =
    `<p class="lead">Plain-English definitions for everything used on the other tabs.</p>
     <dl class="gloss">` +
    g.map(x => `<dt>${esc(x.term)}</dt><dd>${esc(x.definition)}</dd>`).join("") + `</dl>`;
}

function showTab(name){
  const btn = document.querySelector('.tab-btn[data-tab="' + name + '"]');
  if (btn) btn.click();
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.tablink");
  if (!a) return;
  e.preventDefault();
  showTab(a.dataset.go);
  window.scrollTo({top: 0, behavior: "smooth"});
});
document.querySelectorAll(".tab-btn").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById("tab-" + b.dataset.tab).classList.add("active");
});
renderProvenance(); renderSeason(); renderPower(); renderSU(); renderATS(); renderProps(); renderDiag(); renderGloss();
</script>
</body>
</html>
